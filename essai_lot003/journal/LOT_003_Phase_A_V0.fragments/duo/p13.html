<ul>
<li>Une polyurie se prouve par une diurèse de 24 heures.</li>
<li>La <a class="tm med" data-auto="1" href="#med-78279c99">desmopressine</a> est interdite dans la polydipsie primaire.</li>
<li>L'acidocétose se traite par perfusion, potassium, puis insuline.</li>
<li>Une hypercalcémie avec <abbr class="ab" data-k="PTH" tabindex="0">PTH</abbr> basse impose l'hydratation.</li>
</ul>
