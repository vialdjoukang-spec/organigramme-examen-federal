<style>.illustration{margin:20px 0;padding:16px;border:1px solid #768795;border-radius:12px;background:#fff;color:#142633}.illustration svg{display:block;width:100%;height:auto}.illustration .scene{position:relative;max-width:760px;margin:auto}.illustration .repere{position:absolute;transform:translate(-50%,-50%);padding:0!important;min-width:30px;min-height:30px;border:2px solid #fff;border-radius:50%;background:#162c48!important;color:#fff!important;font:700 16px system-ui;cursor:pointer}.illustration .nom{display:none;position:absolute;bottom:100%;left:0;padding:5px 8px;min-width:140px;background:#162c48;color:white;font:14px system-ui;z-index:2}.illustration .repere:hover .nom,.illustration .repere:focus .nom{display:block}.illustration .definition{box-sizing:border-box;max-width:min(90vw,550px);max-height:80vh;overflow:auto;padding:12px;border-left:4px solid #087985;margin:8px 0;background:#edf6f7}.illustration summary{cursor:pointer;padding:9px}.illustration figcaption{font-size:14px;margin-top:12px}.illustration p{line-height:1.5}.illustration .mode{font-weight:700;color:#304a64}</style><figure class="illustration" data-illustration="i018-niveaux-visuels" data-dessin-exempte="true"><h3>Voies visuelles : trois niveaux de coupe</h3><p class="mode">Schémas pédagogiques conceptuels, hors échelle ; aucune image de patient.</p><p>Ouvrez une vue. Les noms apparaissent au survol ou au toucher des numéros ; cliquez pour les définitions.</p><p><strong>Orientation commune :</strong> coupes frontales vues de face ; droite du patient à gauche du dessin, haut vers le sommet du crâne. Trois positions successives d’avant en arrière, sans distance ni épaisseur mesurée. Les contours pointillés repèrent l’anatomie normale ; ils ne désignent pas des lésions.</p><details open><summary>1. Niveau orbitaire — en arrière des globes</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="1. Niveau orbitaire — en arrière des globes"><rect width="720" height="320" fill="#f5f9fc"/><ellipse cx="230" cy="160" rx="104" ry="116" fill="#e2e7ed" stroke="#718392" stroke-width="3"/><ellipse cx="230" cy="160" rx="92" ry="104" fill="#f4e9bd"/><ellipse cx="230" cy="160" rx="24" ry="24" fill="#087d8a"/><path d="M197 160 a33 33 0 1 0 66 0 a33 33 0 1 0 -66 0" fill="none" stroke="#152538" stroke-width="6"/><path d="M197 160 a33 33 0 1 0 66 0 a33 33 0 1 0 -66 0" fill="none" stroke="#ffec68" stroke-width="3" stroke-dasharray="7 5"/><ellipse cx="490" cy="160" rx="104" ry="116" fill="#e2e7ed" stroke="#718392" stroke-width="3"/><ellipse cx="490" cy="160" rx="92" ry="104" fill="#f4e9bd"/><ellipse cx="490" cy="160" rx="24" ry="24" fill="#087d8a"/><path d="M457 160 a33 33 0 1 0 66 0 a33 33 0 1 0 -66 0" fill="none" stroke="#152538" stroke-width="6"/><path d="M457 160 a33 33 0 1 0 66 0 a33 33 0 1 0 -66 0" fill="none" stroke="#ffec68" stroke-width="3" stroke-dasharray="7 5"/><line x1="120" y1="60" x2="215" y2="139" stroke="#132d3d" stroke-width="2"/><line x1="600" y1="60" x2="505" y2="139" stroke="#132d3d" stroke-width="2"/></svg><button type="button" class="repere" style="left:16.667%;top:18.750%" popovertarget="i018-niveaux-visuels-v0-r1" aria-label="1. Nerf optique droit">1<span class="nom">Nerf optique droit</span></button><button type="button" class="repere" style="left:83.333%;top:18.750%" popovertarget="i018-niveaux-visuels-v0-r2" aria-label="2. Nerf optique gauche">2<span class="nom">Nerf optique gauche</span></button></div><div id="i018-niveaux-visuels-v0-r1" class="definition" popover="manual"><strong>1. Nerf optique droit</strong><p>Section du nerf dans l’orbite droite, à gauche du dessin. Il conduit l’information de l’œil droit avant le chiasma.</p><button type="button" popovertarget="i018-niveaux-visuels-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-niveaux-visuels-v0-r2" class="definition" popover="manual"><strong>2. Nerf optique gauche</strong><p>Section du nerf de l’autre œil. Les globes, situés plus en avant, ne sont pas dans cette coupe.</p><button type="button" popovertarget="i018-niveaux-visuels-v0-r2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Nerf optique droit</strong> : Section du nerf dans l’orbite droite, à gauche du dessin. Il conduit l’information de l’œil droit avant le chiasma.</li><li><strong>Nerf optique gauche</strong> : Section du nerf de l’autre œil. Les globes, situés plus en avant, ne sont pas dans cette coupe.</li></ol><p><strong>Lecture et pièges :</strong> Les deux nerfs sont dessinés séparément. Une atteinte préchiasmatique peut produire un déficit monoculaire. La couleur turquoise indique une structure normale, pas un hypersignal inflammatoire.</p></details><details ><summary>2. Niveau chiasmatique — région suprasellaire</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="2. Niveau chiasmatique — région suprasellaire"><rect width="720" height="320" fill="#f5f9fc"/><ellipse cx="360" cy="156" rx="250" ry="136" fill="#e5ebf1"/><rect x="290" y="112" width="140" height="24" fill="#087d8a" rx="9"/><ellipse cx="360" cy="215" rx="43" ry="26" fill="#a883b8"/><path d="M280 102 H440 V146 H280 Z" fill="none" stroke="#152538" stroke-width="6"/><path d="M280 102 H440 V146 H280 Z" fill="none" stroke="#ffec68" stroke-width="3" stroke-dasharray="7 5"/><line x1="535" y1="75" x2="417" y2="124" stroke="#132d3d" stroke-width="2"/><line x1="525" y1="260" x2="397" y2="225" stroke="#132d3d" stroke-width="2"/></svg><button type="button" class="repere" style="left:74.306%;top:23.438%" popovertarget="i018-niveaux-visuels-v1-r1" aria-label="1. Chiasma optique">1<span class="nom">Chiasma optique</span></button><button type="button" class="repere" style="left:72.917%;top:81.250%" popovertarget="i018-niveaux-visuels-v1-r2" aria-label="2. Hypophyse">2<span class="nom">Hypophyse</span></button></div><div id="i018-niveaux-visuels-v1-r1" class="definition" popover="manual"><strong>1. Chiasma optique</strong><p>Bande turquoise au-dessus de l’hypophyse. Les fibres des hémirétines nasales y changent de côté ; toutes les fibres ne croisent pas.</p><button type="button" popovertarget="i018-niveaux-visuels-v1-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-niveaux-visuels-v1-r2" class="definition" popover="manual"><strong>2. Hypophyse</strong><p>Repère violet situé sous le chiasma. Aucune masse ni compression n’est représentée.</p><button type="button" popovertarget="i018-niveaux-visuels-v1-r2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Chiasma optique</strong> : Bande turquoise au-dessus de l’hypophyse. Les fibres des hémirétines nasales y changent de côté ; toutes les fibres ne croisent pas.</li><li><strong>Hypophyse</strong> : Repère violet situé sous le chiasma. Aucune masse ni compression n’est représentée.</li></ol><p><strong>Lecture et pièges :</strong> Une atteinte chiasmatique peut altérer les deux champs temporaux. Ce schéma spatial ne représente ni le trajet individuel des fibres ni une imagerie de tumeur.</p></details><details ><summary>3. Niveau occipital — berges des sillons calcarins</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="3. Niveau occipital — berges des sillons calcarins"><rect width="720" height="320" fill="#f5f9fc"/><path d="M345 35 C120 15 100 300 345 285 L345 185 L285 160 L345 135 Z" fill="#dde6ee" stroke="#718392" stroke-width="3"/><path d="M375 35 C600 15 620 300 375 285 L375 185 L435 160 L375 135 Z" fill="#dde6ee" stroke="#718392" stroke-width="3"/><path d="M335 110 L335 129 L275 160 L335 191 L335 212" fill="none" stroke="#ce6b2a" stroke-width="14"/><path d="M385 110 L385 129 L445 160 L385 191 L385 212" fill="none" stroke="#ce6b2a" stroke-width="14"/><line x1="160" y1="65" x2="306" y2="142" stroke="#132d3d" stroke-width="2"/><line x1="560" y1="65" x2="414" y2="142" stroke="#132d3d" stroke-width="2"/><line x1="230" y1="260" x2="310" y2="160" stroke="#132d3d" stroke-width="2"/></svg><button type="button" class="repere" style="left:22.222%;top:20.312%" popovertarget="i018-niveaux-visuels-v2-r1" aria-label="1. Cortex visuel droit">1<span class="nom">Cortex visuel droit</span></button><button type="button" class="repere" style="left:77.778%;top:20.312%" popovertarget="i018-niveaux-visuels-v2-r2" aria-label="2. Cortex visuel gauche">2<span class="nom">Cortex visuel gauche</span></button><button type="button" class="repere" style="left:31.944%;top:81.250%" popovertarget="i018-niveaux-visuels-v2-r3" aria-label="3. Sillon calcarin droit">3<span class="nom">Sillon calcarin droit</span></button></div><div id="i018-niveaux-visuels-v2-r1" class="definition" popover="manual"><strong>1. Cortex visuel droit</strong><p>Berges orange de la face médiale occipitale droite. Ce côté participe à la vision de l’hémichamp gauche des deux yeux.</p><button type="button" popovertarget="i018-niveaux-visuels-v2-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-niveaux-visuels-v2-r2" class="definition" popover="manual"><strong>2. Cortex visuel gauche</strong><p>Berges orange du côté gauche. Une atteinte de ce côté peut donner un déficit homonyme droit.</p><button type="button" popovertarget="i018-niveaux-visuels-v2-r2" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-niveaux-visuels-v2-r3" class="definition" popover="manual"><strong>3. Sillon calcarin droit</strong><p>Enfoncement médial stylisé, entre les deux berges orangées. La disposition réelle des plis varie.</p><button type="button" popovertarget="i018-niveaux-visuels-v2-r3" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Cortex visuel droit</strong> : Berges orange de la face médiale occipitale droite. Ce côté participe à la vision de l’hémichamp gauche des deux yeux.</li><li><strong>Cortex visuel gauche</strong> : Berges orange du côté gauche. Une atteinte de ce côté peut donner un déficit homonyme droit.</li><li><strong>Sillon calcarin droit</strong> : Enfoncement médial stylisé, entre les deux berges orangées. La disposition réelle des plis varie.</li></ol><p><strong>Lecture et pièges :</strong> Les nerfs optiques ne se prolongent pas directement dans le cortex : les voies postchiasmatiques comportent un relais géniculé puis les radiations, hors de cette coupe. Distinguer perte d’un hémichamp et perte d’un œil.</p></details><figcaption>Codex — schémas originaux, CC BY 4.0 ; aucune figure publiée reproduite. Schéma original expliqué ; accès documentaire 2026-11-01. <a href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/la-semiologie-neurologique-et-ses-bases-anatomofonctionnelles/chapitre-9-semiologie-des-nerfs-craniens">Source médicale</a>. Les formes sont une simplification pédagogique, sans seuil ni mesure de patient. <a href="https://www.hug.ch/neuroreeducation/atteinte-champ-visuel">HUG : côté du déficit visuel</a>. <a href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/notions-fondamentales/chapitre-1-anatomie-descriptive-et-fonctionnelle">CEN : anatomie occipitale</a>. <a href="https://creativecommons.org/licenses/by/4.0/">Licence du dessin</a>.</figcaption></figure>
