9,99 79,99 63,104" fill="none" stroke="#ffff68" stroke-width="1.7" stroke-dasharray="4 3"/></svg><button type="button" class="repere" style="left:21.111%;top:31.667%" popovertarget="i018-optique-def1" aria-label="1. Segment du nerf optique">1<span class="nom">Segment du nerf optique</span></button><button type="button" class="repere" style="left:50.556%;top:75.833%" popovertarget="i018-optique-def2" aria-label="2. Chiasma optique">2<span class="nom">Chiasma optique</span></button></div><div id="i018-optique-def1" popover="manual" class="definition"><strong>1. Segment du nerf optique</strong><p>Faisceau préchiasmatique reliant un œil au chiasma. Une atteinte préchiasmatique peut altérer la vision d’un seul œil ; ce dessin montre une anatomie normale.</p><button type="button" popovertarget="i018-optique-def1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-optique-def2" popover="manual" class="definition"><strong>2. Chiasma optique</strong><p>Zone où croisent les fibres issues des hémirétines nasales. Une lésion chiasmatique peut donner un déficit temporal des deux champs visuels ; ce tableau n’est pas celui d’une atteinte monoculaire isolée.</p><button type="button" popovertarget="i018-optique-def2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Segment du nerf optique</strong> : Faisceau préchiasmatique reliant un œil au chiasma. Une atteinte préchiasmatique peut altérer la vision d’un seul œil ; ce dessin montre une anatomie normale.</li><li><strong>Chiasma optique</strong> : Zone où croisent les fibres issues des hémirétines nasales. Une lésion chiasmatique peut donner un déficit temporal des deux champs visuels ; ce tableau n’est pas celui d’une atteinte monoculaire isolée.</li></ol><p>Vue inférieure recadrée : les segments verts correspondent aux voies optiques antérieures. Les pointillés repèrent des structures normales ; ils ne montrent aucune névrite ni lésion réelle. Les deux yeux sont en amont, hors du cadre.</p><p><strong>Piège :</strong> Une image anatomique normale ne prouve pas une neuropathie. Ne pas confondre le nerf optique avec le bulbe olfactif ; la latéralité du patient ne doit pas être inférée de ce recadrage.</p><figcaption>Patrick J. Lynch ; adaptation Beao ; annotations Codex — CC BY 2.5 — accès 2026-10-31. Copie WebP déjà présente dans le dépôt ; recadrage central, contours pointillés et numéros superposés. Œuvre dérivée sous CC BY 2.5. <a href="https://commons.wikimedia.org/wiki/File:Brain_human_normal_inferior_view_with_labels_en.svg">Source</a> · <a href="https://creativecommons.org/licenses/by/2.5/">Licence</a> · <a href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-voies-optiques">Référence médicale</a></figcaption></figure>
