<style>.illustration{margin:20px 0;padding:16px;border:1px solid #768795;border-radius:12px;background:#fff;color:#142633}.illustration svg{display:block;width:100%;height:auto}.illustration .scene{position:relative;max-width:760px;margin:auto}.illustration .repere{position:absolute;transform:translate(-50%,-50%);padding:0!important;min-width:30px;min-height:30px;border:2px solid #fff;border-radius:50%;background:#162c48!important;color:#fff!important;font:700 16px system-ui;cursor:pointer}.illustration .nom{display:none;position:absolute;bottom:100%;left:0;padding:5px 8px;min-width:140px;background:#162c48;color:white;font:14px system-ui;z-index:2}.illustration .repere:hover .nom,.illustration .repere:focus .nom{display:block}.illustration .definition{box-sizing:border-box;max-width:min(90vw,550px);max-height:80vh;overflow:auto;padding:12px;border-left:4px solid #087985;margin:8px 0;background:#edf6f7}.illustration summary{cursor:pointer;padding:9px}.illustration figcaption{font-size:14px;margin-top:12px}.illustration p{line-height:1.5}.illustration .mode{font-weight:700;color:#304a64}</style><figure class="illustration" data-illustration="i018-halo-temporal" data-dessin-exempte="true"><h3>Artère temporale : comprendre le halo dans deux plans</h3><p class="mode">Schémas pédagogiques conceptuels, hors échelle ; aucune image de patient.</p><p>Ouvrez une vue. Les noms apparaissent au survol ou au toucher des numéros ; cliquez pour les définitions.</p><details open><summary>1. Coupe transversale de référence</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="1. Coupe transversale de référence"><rect width="720" height="320" fill="#f5f9fc"/><rect x="100" y="20" width="520" height="280" fill="#b8c3cb" rx="12"/><ellipse cx="360" cy="160" rx="88" ry="88" fill="#e8edf0"/><ellipse cx="360" cy="160" rx="76" ry="76" fill="#d85b38"/><line x1="205" y1="65" x2="297" y2="100" stroke="#142633" stroke-width="2"/></svg><button type="button" class="repere" style="left:50.000%;top:50.000%" popovertarget="i018-halo-temporal-v0-r1" aria-label="1. Lumière artérielle">1<span class="nom">Lumière artérielle</span></button><button type="button" class="repere" style="left:28.472%;top:20.312%" popovertarget="i018-halo-temporal-v0-r2" aria-label="2. Paroi fine de référence">2<span class="nom">Paroi fine de référence</span></button></div><div id="i018-halo-temporal-v0-r1" class="definition" popover="manual"><strong>1. Lumière artérielle</strong><p>Centre orange : convention de remplissage Doppler, sans mesure de débit.</p><button type="button" popovertarget="i018-halo-temporal-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-halo-temporal-v0-r2" class="definition" popover="manual"><strong>2. Paroi fine de référence</strong><p>Anneau clair schématique ; son épaisseur dessinée ne définit pas un seuil normal.</p><button type="button" popovertarget="i018-halo-temporal-v0-r2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Lumière artérielle</strong> : Centre orange : convention de remplissage Doppler, sans mesure de débit.</li><li><strong>Paroi fine de référence</strong> : Anneau clair schématique ; son épaisseur dessinée ne définit pas un seuil normal.</li></ol><p><strong>Lecture et pièges :</strong> Cette vue sert de comparaison anatomique. Les couleurs sont conventionnelles. Il ne s’agit ni d’une acquisition en mode B ni d’un Doppler réel.</p></details><details ><summary>2. Coupe transversale : épaississement pariétal</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="2. Coupe transversale : épaississement pariétal"><rect width="720" height="320" fill="#f5f9fc"/><rect x="100" y="20" width="520" height="280" fill="#b8c3cb" rx="12"/><ellipse cx="360" cy="160" rx="110" ry="110" fill="#253441"/><ellipse cx="360" cy="160" rx="65" ry="65" fill="#d85b38"/><path d="M245 160 a115 115 0 1 0 230 0 a115 115 0 1 0 -230 0" fill="none" stroke="#142633" stroke-width="7"/><path d="M245 160 a115 115 0 1 0 230 0 a115 115 0 1 0 -230 0" fill="none" stroke="#ffed69" stroke-width="3" stroke-dasharray="8 6"/><line x1="535" y1="60" x2="430" y2="95" stroke="#142633" stroke-width="2"/></svg><button type="button" class="repere" style="left:50.000%;top:50.000%" popovertarget="i018-halo-temporal-v1-r1" aria-label="1. Lumière centrale">1<span class="nom">Lumière centrale</span></button><button type="button" class="repere" style="left:74.306%;top:18.750%" popovertarget="i018-halo-temporal-v1-r2" aria-label="2. Halo pariétal">2<span class="nom">Halo pariétal</span></button></div><div id="i018-halo-temporal-v1-r1" class="definition" popover="manual"><strong>1. Lumière centrale</strong><p>Le centre reste distinct de la paroi. Sa couleur représente un signal Doppler conventionnel.</p><button type="button" popovertarget="i018-halo-temporal-v1-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-halo-temporal-v1-r2" class="definition" popover="manual"><strong>2. Halo pariétal</strong><p>L’anneau sombre figure une paroi épaissie, homogène et hypoéchogène. Les pointillés en délimitent le bord externe.</p><button type="button" popovertarget="i018-halo-temporal-v1-r2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Lumière centrale</strong> : Le centre reste distinct de la paroi. Sa couleur représente un signal Doppler conventionnel.</li><li><strong>Halo pariétal</strong> : L’anneau sombre figure une paroi épaissie, homogène et hypoéchogène. Les pointillés en délimitent le bord externe.</li></ol><p><strong>Lecture et pièges :</strong> Le halo appartient à la paroi, pas au tissu autour du vaisseau. Un aspect évocateur doit être interprété avec la clinique et distingué notamment de l’athérome par un opérateur entraîné.</p></details><details ><summary>3. Coupe longitudinale du segment représenté</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="3. Coupe longitudinale du segment représenté"><rect width="720" height="320" fill="#f5f9fc"/><rect x="100" y="20" width="520" height="280" fill="#b8c3cb" rx="12"/><rect x="125" y="50" width="470" height="220" fill="#253441"/><rect x="125" y="95" width="470" height="130" fill="#d85b38"/><path d="M125 50 H595 V95 H125 Z" fill="none" stroke="#142633" stroke-width="7"/><path d="M125 50 H595 V95 H125 Z" fill="none" stroke="#ffed69" stroke-width="3" stroke-dasharray="8 6"/><path d="M125 225 H595 V270 H125 Z" fill="none" stroke="#142633" stroke-width="7"/><path d="M125 225 H595 V270 H125 Z" fill="none" stroke="#ffed69" stroke-width="3" stroke-dasharray="8 6"/><line x1="60" y1="73" x2="260" y2="73" stroke="#142633" stroke-width="2"/><line x1="660" y1="247" x2="460" y2="247" stroke="#142633" stroke-width="2"/></svg><button type="button" class="repere" style="left:50.000%;top:50.000%" popovertarget="i018-halo-temporal-v2-r1" aria-label="1. Lumière longitudinale">1<span class="nom">Lumière longitudinale</span></button><button type="button" class="repere" style="left:8.333%;top:22.812%" popovertarget="i018-halo-temporal-v2-r2" aria-label="2. Paroi superficielle épaissie">2<span class="nom">Paroi superficielle épaissie</span></button><button type="button" class="repere" style="left:91.667%;top:77.188%" popovertarget="i018-halo-temporal-v2-r3" aria-label="3. Paroi profonde épaissie">3<span class="nom">Paroi profonde épaissie</span></button></div><div id="i018-halo-temporal-v2-r1" class="definition" popover="manual"><strong>1. Lumière longitudinale</strong><p>Couloir orange central, bordé par les deux parois du segment.</p><button type="button" popovertarget="i018-halo-temporal-v2-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-halo-temporal-v2-r2" class="definition" popover="manual"><strong>2. Paroi superficielle épaissie</strong><p>Bande sombre du haut : représentation longitudinale de la même paroi inflammatoire.</p><button type="button" popovertarget="i018-halo-temporal-v2-r2" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-halo-temporal-v2-r3" class="definition" popover="manual"><strong>3. Paroi profonde épaissie</strong><p>Bande sombre du bas : l’autre bord de la paroi coupée dans son axe. Les deux contours encadrent les bandes représentées.</p><button type="button" popovertarget="i018-halo-temporal-v2-r3" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Lumière longitudinale</strong> : Couloir orange central, bordé par les deux parois du segment.</li><li><strong>Paroi superficielle épaissie</strong> : Bande sombre du haut : représentation longitudinale de la même paroi inflammatoire.</li><li><strong>Paroi profonde épaissie</strong> : Bande sombre du bas : l’autre bord de la paroi coupée dans son axe. Les deux contours encadrent les bandes représentées.</li></ol><p><strong>Lecture et pièges :</strong> Vérifier l’anomalie dans les deux plans. Le dessin ne décrit pas l’étendue réelle de la maladie. Une échographie négative ne suffit pas à exclure une ACG lorsque la suspicion clinique reste forte ; poursuivre le bilan spécialisé.</p></details><figcaption>Codex — dessin original, CC BY 4.0 ; aucun cliché échographique reproduit. Schéma original expliqué ; accès documentaire 2026-10-31. <a href="https://www.lecofer.org/item-cours-1-16-0.php">Source médicale</a>. Les formes sont une simplification pédagogique, sans seuil ni mesure de patient. <a href="https://catalogue.chuv.ch/miajour/comptes-rendus/fiche/mia_review_141/avant-la-biopsie-evaluer-lechodoppler-des-arteres-temporales-pour-le-diagnostic-de-larterite-a-cellules-geantes">CHUV : interprétation dans la démarche diagnostique</a>. <a href="https://creativecommons.org/licenses/by/4.0/">Licence du dessin : CC BY 4.0</a>.</figcaption></figure>
