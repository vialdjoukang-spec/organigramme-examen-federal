<style>.illustration{margin:20px 0;padding:16px;border:1px solid #768795;border-radius:12px;background:#fff;color:#142633}.illustration svg{display:block;width:100%;height:auto}.illustration .scene{position:relative;max-width:760px;margin:auto}.illustration .repere{position:absolute;transform:translate(-50%,-50%);padding:0!important;min-width:30px;min-height:30px;border:2px solid #fff;border-radius:50%;background:#162c48!important;color:#fff!important;font:700 16px system-ui;cursor:pointer}.illustration .nom{display:none;position:absolute;bottom:100%;left:0;padding:5px 8px;min-width:140px;background:#162c48;color:white;font:14px system-ui;z-index:2}.illustration .repere:hover .nom,.illustration .repere:focus .nom{display:block}.illustration .definition{box-sizing:border-box;max-width:min(90vw,550px);max-height:80vh;overflow:auto;padding:12px;border-left:4px solid #087985;margin:8px 0;background:#edf6f7}.illustration summary{cursor:pointer;padding:9px}.illustration figcaption{font-size:14px;margin-top:12px}.illustration p{line-height:1.5}.illustration .mode{font-weight:700;color:#304a64}</style><figure class="illustration" data-illustration="i018-retine" data-dessin-exempte="true"><h3>Comprendre le plan du décollement rétinien</h3><p class="mode">Schémas pédagogiques conceptuels, hors échelle ; aucune image de patient.</p><p>Ouvrez une vue. Les noms apparaissent au survol ou au toucher des numéros ; cliquez pour les définitions.</p><details open><summary>Coupe locale 1 — rétine appliquée</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Coupe locale 1 — rétine appliquée"><rect width="720" height="320" fill="#f5f9fc"/><rect x="35" y="218" width="650" height="26" fill="#9b6547" rx="5"/><rect x="35" y="244" width="650" height="36" fill="#d49b85" rx="5"/><rect x="35" y="180" width="650" height="38" fill="#62c5ba" rx="5"/></svg><button type="button" class="repere" style="left:18.750%;top:63.125%" popovertarget="i018-retine-v0-r1" aria-label="1. Rétine neurosensorielle">1<span class="nom">Rétine neurosensorielle</span></button><button type="button" class="repere" style="left:79.167%;top:71.875%" popovertarget="i018-retine-v0-r2" aria-label="2. Épithélium pigmentaire">2<span class="nom">Épithélium pigmentaire</span></button><button type="button" class="repere" style="left:90.278%;top:82.500%" popovertarget="i018-retine-v0-r3" aria-label="3. Choroïde">3<span class="nom">Choroïde</span></button></div><div id="i018-retine-v0-r1" class="definition" popover="manual"><strong>1. Rétine neurosensorielle</strong><p>Tissu nerveux comprenant les photorécepteurs. Le schéma simplifie ses couches ; la lumière arrive du côté du vitré.</p><button type="button" popovertarget="i018-retine-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-retine-v0-r2" class="definition" popover="manual"><strong>2. Épithélium pigmentaire</strong><p>Couche pigmentée située sous les photorécepteurs ; elle est représentée en brun.</p><button type="button" popovertarget="i018-retine-v0-r2" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-retine-v0-r3" class="definition" popover="manual"><strong>3. Choroïde</strong><p>Tissu vasculaire sous l’épithélium pigmentaire, représenté en rose sombre ; les vaisseaux ne sont pas détaillés.</p><button type="button" popovertarget="i018-retine-v0-r3" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Rétine neurosensorielle</strong> : Tissu nerveux comprenant les photorécepteurs. Le schéma simplifie ses couches ; la lumière arrive du côté du vitré.</li><li><strong>Épithélium pigmentaire</strong> : Couche pigmentée située sous les photorécepteurs ; elle est représentée en brun.</li><li><strong>Choroïde</strong> : Tissu vasculaire sous l’épithélium pigmentaire, représenté en rose sombre ; les vaisseaux ne sont pas détaillés.</li></ol><p><strong>Lecture et pièges :</strong> En haut : côté vitré. En bas : tissus externes de l’œil. La rétine est appliquée sur son support pigmentaire ; les épaisseurs ne sont pas respectées.</p></details><details ><summary>Coupe locale 2 — mécanisme rhegmatogène simplifié</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Coupe locale 2 — mécanisme rhegmatogène simplifié"><rect width="720" height="320" fill="#f5f9fc"/><rect x="35" y="218" width="650" height="26" fill="#9b6547" rx="5"/><rect x="35" y="244" width="650" height="36" fill="#d49b85" rx="5"/><path d="M210 218 Q267 136 335 133 L355 133 Q434 137 498 218 Z" fill="#bee5fc"/><path d="M35 180 L210 180 Q265 105 335 102 L335 133 Q266 137 218 218 L35 218 Z M355 102 Q445 106 505 180 L685 180 L685 218 L498 218 Q434 137 355 133 Z" fill="#62c5ba" stroke="#24685f"/><path d="M220 211 Q276 145 335 143 L355 143 Q425 147 485 211 Z" fill="none" stroke="#152538" stroke-width="5"/><path d="M220 211 Q276 145 335 143 L355 143 Q425 147 485 211 Z" fill="none" stroke="#ffe766" stroke-width="3" stroke-dasharray="8 6"/><line x1="345" x2="345" y1="84" y2="101" stroke="#162c48" stroke-width="2"/></svg><button type="button" class="repere" style="left:47.917%;top:20.312%" popovertarget="i018-retine-v1-r1" aria-label="1. Déchirure rétinienne">1<span class="nom">Déchirure rétinienne</span></button><button type="button" class="repere" style="left:47.917%;top:56.563%" popovertarget="i018-retine-v1-r2" aria-label="2. Espace sous-rétinien">2<span class="nom">Espace sous-rétinien</span></button><button type="button" class="repere" style="left:79.167%;top:71.875%" popovertarget="i018-retine-v1-r3" aria-label="3. Épithélium pigmentaire">3<span class="nom">Épithélium pigmentaire</span></button></div><div id="i018-retine-v1-r1" class="definition" popover="manual"><strong>1. Déchirure rétinienne</strong><p>Interruption représentée au sommet de la rétine. Dans un décollement rhegmatogène, une rupture permet le passage de liquide sous la rétine.</p><button type="button" popovertarget="i018-retine-v1-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-retine-v1-r2" class="definition" popover="manual"><strong>2. Espace sous-rétinien</strong><p>Zone bleue entre la rétine soulevée et l’épithélium pigmentaire, entourée de pointillés. Il s’agit d’un mécanisme dessiné, pas d’une lésion observée sur un cliché.</p><button type="button" popovertarget="i018-retine-v1-r2" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-retine-v1-r3" class="definition" popover="manual"><strong>3. Épithélium pigmentaire</strong><p>Couche pigmentée située sous les photorécepteurs ; elle est représentée en brun.</p><button type="button" popovertarget="i018-retine-v1-r3" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Déchirure rétinienne</strong> : Interruption représentée au sommet de la rétine. Dans un décollement rhegmatogène, une rupture permet le passage de liquide sous la rétine.</li><li><strong>Espace sous-rétinien</strong> : Zone bleue entre la rétine soulevée et l’épithélium pigmentaire, entourée de pointillés. Il s’agit d’un mécanisme dessiné, pas d’une lésion observée sur un cliché.</li><li><strong>Épithélium pigmentaire</strong> : Couche pigmentée située sous les photorécepteurs ; elle est représentée en brun.</li></ol><p><strong>Lecture et pièges :</strong> Les pointillés signalent la séparation schématique. Le dessin ne localise ni macula ni déchirure chez un patient. Il ne distingue pas à lui seul un décollement rhegmatogène, tractionnel ou exsudatif : l’examen ophtalmologique établit le mécanisme.</p></details><figcaption>Codex — dessin pédagogique original, CC BY 4.0. Schéma original expliqué ; accès documentaire 2026-10-31. <a href="https://www.hug.ch/ophtalmologie/decollement-retine">Source médicale</a>. Les formes sont une simplification pédagogique, sans seuil ni mesure de patient.</figcaption></figure>
