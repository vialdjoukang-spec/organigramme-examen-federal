 0" fill="none" stroke="#152538" stroke-width="5"/><path d="M445 160 a65 95 0 1 0 130 0 a65 95 0 1 0 -130 0" fill="none" stroke="#ffe766" stroke-width="3" stroke-dasharray="8 6"/></svg><button type="button" class="repere" style="left:29.167%;top:50.000%" popovertarget="i018-dx4-v0-r1" aria-label="1. Excavation centrale">1<span class="nom">Excavation centrale</span></button><button type="button" class="repere" style="left:70.833%;top:50.000%" popovertarget="i018-dx4-v0-r2" aria-label="2. Excavation élargie">2<span class="nom">Excavation élargie</span></button><button type="button" class="repere" style="left:83.333%;top:50.000%" popovertarget="i018-dx4-v0-r3" aria-label="3. Anneau résiduel">3<span class="nom">Anneau résiduel</span></button></div><div id="i018-dx4-v0-r1" class="definition" popover="manual"><strong>1. Excavation centrale</strong><p>Dépression centrale physiologique, ici entourée d’un anneau large.</p><button type="button" popovertarget="i018-dx4-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-dx4-v0-r2" class="definition" popover="manual"><strong>2. Excavation élargie</strong><p>Un élargissement peut accompagner une perte de tissu neurorétinien ; les pointillés en indiquent les limites dessinées.</p><button type="button" popovertarget="i018-dx4-v0-r2" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-dx4-v0-r3" class="definition" popover="manual"><strong>3. Anneau résiduel</strong><p>Zone rose périphérique amincie dans cet exemple.</p><button type="button" popovertarget="i018-dx4-v0-r3" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Excavation centrale</strong> : Dépression centrale physiologique, ici entourée d’un anneau large.</li><li><strong>Excavation élargie</strong> : Un élargissement peut accompagner une perte de tissu neurorétinien ; les pointillés en indiquent les limites dessinées.</li><li><strong>Anneau résiduel</strong> : Zone rose périphérique amincie dans cet exemple.</li></ol><p><strong>Lecture et pièges :</strong> Les dimensions sont arbitraires : aucun rapport seuil n’est proposé. Une grande excavation peut être physiologique ; interpréter avec taille papillaire, asymétrie, fibres, champ visuel et évolution.</p></details><figcaption>Codex — schéma pédagogique original, CC BY 4.0. Schéma original expliqué ; accès documentaire 2026-10-31. <a href="https://couf.fr/xhtml/Ch014_249-265_B978229478662450023X.xhtml/">Source médicale</a>. Les formes sont une simplification pédagogique, sans seuil ni mesure de patient.</figcaption></figure>
