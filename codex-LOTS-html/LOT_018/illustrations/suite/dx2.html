g>Cristallin transparent</strong> : La lumière traverse le cristallin et participe à la formation d’une image nette.</li><li><strong>Opacités cristalliniennes</strong> : Les plages brunes figurent une perte de transparence, entourée de pointillés. Leur forme est illustrative, sans classification de cataracte.</li></ol><p><strong>Lecture et pièges :</strong> Une opacité doit être confrontée à la gêne et à la lampe à fente. Une autre atteinte, notamment rétinienne, peut limiter la vision ; ce dessin ne prédit pas le résultat opératoire.</p></details><figcaption>Codex — schéma pédagogique original, CC BY 4.0. Schéma original expliqué ; accès documentaire 2026-10-31. <a href="https://www.hug.ch/ophtalmologie/operation-cataracte">Source médicale</a>. Les formes sont une simplification pédagogique, sans seuil ni mesure de patient.</figcaption></figure>
