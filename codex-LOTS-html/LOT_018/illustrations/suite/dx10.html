 0 1 0 224 0 a112 132 0 1 0 -224 0" fill="none" stroke="#152538" stroke-width="5"/><path d="M398 160 a112 132 0 1 0 224 0 a112 132 0 1 0 -224 0" fill="none" stroke="#ffe766" stroke-width="3" stroke-dasharray="8 6"/></svg><button type="button" class="repere" style="left:30.556%;top:50.000%" popovertarget="i018-dx10-v0-r1" aria-label="1. Papille de référence">1<span class="nom">Papille de référence</span></button><button type="button" class="repere" style="left:70.833%;top:50.000%" popovertarget="i018-dx10-v0-r2" aria-label="2. Œdème papillaire pâle">2<span class="nom">Œdème papillaire pâle</span></button></div><div id="i018-dx10-v0-r1" class="definition" popover="manual"><strong>1. Papille de référence</strong><p>Disque optique dessiné à limites régulières.</p><button type="button" popovertarget="i018-dx10-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-dx10-v0-r2" class="definition" popover="manual"><strong>2. Œdème papillaire pâle</strong><p>Gonflement et pâleur représentés autour de la papille. Une neuropathie optique ischémique antérieure peut présenter cet aspect.</p><button type="button" popovertarget="i018-dx10-v0-r2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Papille de référence</strong> : Disque optique dessiné à limites régulières.</li><li><strong>Œdème papillaire pâle</strong> : Gonflement et pâleur représentés autour de la papille. Une neuropathie optique ischémique antérieure peut présenter cet aspect.</li></ol><p><strong>Lecture et pièges :</strong> Cet aspect ne prouve pas une artérite à cellules géantes : il existe des formes non artéritiques. Le contexte, les examens inflammatoires et l’imagerie ou l’histologie artérielle guident la confirmation, sans retarder la prise en charge urgente si la suspicion est forte.</p></details><figcaption>Codex — schéma pédagogique original, CC BY 4.0. Schéma original expliqué ; accès documentaire 2026-10-31. <a href="https://couf.fr/xhtml/Ch016_283-302_B9782294786624500253.xhtml/">Source médicale</a>. Les formes sont une simplification pédagogique, sans seuil ni mesure de patient.</figcaption></figure>
