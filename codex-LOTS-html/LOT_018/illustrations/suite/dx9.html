56 510 240" fill="none" stroke="#a16d5e" stroke-width="3"/><ellipse cx="450" cy="160" rx="22" ry="18" fill="#b33143"/><path d="M417 160 a33 29 0 1 0 66 0 a33 29 0 1 0 -66 0" fill="none" stroke="#152538" stroke-width="5"/><path d="M417 160 a33 29 0 1 0 66 0 a33 29 0 1 0 -66 0" fill="none" stroke="#ffe766" stroke-width="3" stroke-dasharray="8 6"/><line x1="510" y1="105" x2="474" y2="141" stroke="#162c48" stroke-width="2"/></svg><button type="button" class="repere" style="left:50.000%;top:65.625%" popovertarget="i018-dx9-v0-r1" aria-label="1. Pâleur rétinienne">1<span class="nom">Pâleur rétinienne</span></button><button type="button" class="repere" style="left:73.611%;top:28.125%" popovertarget="i018-dx9-v0-r2" aria-label="2. Contraste rouge fovéal">2<span class="nom">Contraste rouge fovéal</span></button></div><div id="i018-dx9-v0-r1" class="definition" popover="manual"><strong>1. Pâleur rétinienne</strong><p>Le fond clair représente l’œdème ischémique de la rétine interne.</p><button type="button" popovertarget="i018-dx9-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="i018-dx9-v0-r2" class="definition" popover="manual"><strong>2. Contraste rouge fovéal</strong><p>La fovéola paraît rouge par contraste avec la rétine pâle. Le dessin ne représente pas une hémorragie fovéale.</p><button type="button" popovertarget="i018-dx9-v0-r2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Pâleur rétinienne</strong> : Le fond clair représente l’œdème ischémique de la rétine interne.</li><li><strong>Contraste rouge fovéal</strong> : La fovéola paraît rouge par contraste avec la rétine pâle. Le dessin ne représente pas une hémorragie fovéale.</li></ol><p><strong>Lecture et pièges :</strong> Ces signes peuvent manquer au début. Une baisse brutale impose une évaluation urgente sans attendre cet aspect ; le dessin ne précise pas la cause de l’occlusion.</p></details><figcaption>Codex — schéma pédagogique original, CC BY 4.0. Sch
