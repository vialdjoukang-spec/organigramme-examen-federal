130 370 170 Q415 140 465 170 L660 170" fill="none" stroke="#4baea0" stroke-width="28"/><path d="M230 192 a125 42 0 1 0 250 0 a125 42 0 1 0 -250 0" fill="none" stroke="#152538" stroke-width="5"/><path d="M230 192 a125 42 0 1 0 250 0 a125 42 0 1 0 -250 0" fill="none" stroke="#ffe766" stroke-width="3" stroke-dasharray="8 6"/><line x1="520" y1="110" x2="454" y2="182" stroke="#162c48" stroke-width="2"/></svg><button type="button" class="repere" style="left:75.000%;top:31.250%" popovertarget="i018-dx3-v0-r1" aria-label="1. Drusen">1<span class="nom">Drusen</span></button></div><div id="i018-dx3-v0-r1" class="definition" popover="manual"><strong>1. Drusen</strong><p>Dépôts jaunes sous la ligne brune de l’épithélium pigmentaire, qu’ils soulèvent. Ils ne suffisent pas à prouver une activité néovasculaire.</p><button type="button" popovertarget="i018-dx3-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Drusen</strong> : Dépôts jaunes sous la ligne brune de l’épithélium pigmentaire, qu’ils soulèvent. Ils ne suffisent pas à prouver une activité néovasculaire.</li></ol><p><strong>Lecture et pièges :</strong> Vert : rétine externe simplifiée ; brun : épithélium pigmentaire ; rose : plan choroïdien. Les drusen ne sont pas une collection liquidienne.</p></details><details ><summary>Exsudation : liquide sous-rétinien schématique</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Exsudation : liquide sous-rétinien schématique"><rect width="720" height="320" fill="#f5f9fc"/><rect x="60" y="220" width="600" height="45" fill="#d69b8b"/><rect x="60" y="208" width="600" height="12" fill="#885339"/><path d="M60 170 L250 170 Q355 85 465 170 L660 170" fill="none" stroke="#4baea0" stroke-width="28"/><path d="M250 184 Q355 99 465 184 L465 207 L250 207 Z" fill="#b5dff6" stroke="#6fa5c7" stroke-width="4"/><path d="M240 178 a115 34 0 1 0 230 0 a115 34 0 1 0 -230 0" fill="none" stroke="#152538" stroke-width="5"/><path d="M240 178 a115 34 0 1 0 230 0 a115 34 0 1 0 -230 0" fill="none" stroke="#ffe766" stroke-width="3" stroke-dasharray="8 6"/></svg><button type="button" class="repere" style="left:49.306%;top:54.688%" popovertarget="i018-dx3-v1-r1" aria-label="1. Liquide sous-rétinien">1<span class="nom">Liquide sous-rétinien</span></button></div><div id="i018-dx3-v1-r1" class="definition" popover="manual"><strong>1. Liquide sous-rétinien</strong><p>Zone bleue située au-dessus de l’épithélium pigmentaire et sous la rétine. Une activité néovasculaire est une cause possible, à confirmer par l’imagerie.</p><button type="button" popovertarget="i018-dx3-v1-r1" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Liquide sous-rétinien</strong> : Zone bleue située au-dessus de l’épithélium pigmentaire et sous la rétine. Une activité néovasculaire est une cause possible, à confirmer par l’imagerie.</li></ol><p><strong>Lecture et pièges :</strong> Ce schéma ne représente ni tous les sites possibles du liquide ni la forme atrophique. Il ne remplace pas un OCT et ne permet pas de décider seul d’une injection.</p></details><figcaption>Codex — schéma pédagogique original, CC BY 4.0. Schéma original expliqué ; accès documentaire 2026-10-31. <a href="https://couf.fr/xhtml/Ch015_267-281_B9782294786624500241.xhtml/">Source médicale</a>. Les formes sont une simplification pédagogique, sans seuil ni mesure de patient.</figcaption></figure>
