ne" stroke="#4e5963" stroke-width="2"/></svg><button type="button" class="repere" style="left:12.500%;top:28.125%" popovertarget="sommeil-signaux-v0-r1" aria-label="1. Débit aérien (courbe bleue)">1<span class="nom">Débit aérien (courbe bleue)</span></button><button type="button" class="repere" style="left:12.500%;top:68.750%" popovertarget="sommeil-signaux-v0-r2" aria-label="2. Effort respiratoire (courbe brune)">2<span class="nom">Effort respiratoire (courbe brune)</span></button></div><div id="sommeil-signaux-v0-r1" class="definition" popover="manual"><strong>1. Débit aérien (courbe bleue)</strong><p>Lire d’abord le passage de l’air. Les oscillations illustrent une ventilation régulière. Aucun débit chiffré ni signal réel n’est reproduit.</p><button type="button" popovertarget="sommeil-signaux-v0-r1" popovertargetaction="hide">Fermer la définition</button></div><div id="sommeil-signaux-v0-r2" class="definition" popover="manual"><strong>2. Effort respiratoire (courbe brune)</strong><p>Lire ensuite les mouvements respiratoires. Cette courbe conceptuelle résume les efforts ; elle ne remplace pas les deux signaux thoracique et abdominal d’un enregistrement.</p><button type="button" popovertarget="sommeil-signaux-v0-r2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Débit aérien (courbe bleue)</strong> : Lire d’abord le passage de l’air. Les oscillations illustrent une ventilation régulière. Aucun débit chiffré ni signal réel n’est reproduit.</li><li><strong>Effort respiratoire (courbe brune)</strong> : Lire ensuite les mouvements respiratoires. Cette courbe conceptuelle résume les efforts ; elle ne remplace pas les deux signaux thoracique et abdominal d’un enregistrement.</li></ol><p><strong>Lecture et pièges :</strong> Le temps va de gauche à droite. Durée, amplitude et fréquence sont arbitraires : ce dessin ne permet ni cotation d’événements ni calcul d’un indice d’apnées-hypopnées. La présence de cycles réguliers sur ce dessin ne permet pas d’exclure un trouble du sommeil.</p></details><details ><summary>Apnée obstructive : efforts persistants</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Apnée obstructive : efforts persistants"><rect width="720" height="320" fill="#f5f9fc"/><path d="M140,90.00 L142,85.62 L144,81.35 L146,77.29 L148,73.54 L150,70.20 L152,67.35 L154,65.05 L156,63.37 L158,62.34 L160,62.00 L162,62.34 L164,63.37 L166,65.05 L168,67.35 L170,70.20 L172,73.54 L174,77.29 L176,81.35 L178,85.62 L180,90.00 L182,94.38 L184,98.65 L186,102.71 L188,106.46 L190,109.80 L192,112.65 L194,114.95 L196,116.63 L198,117.66 L200,118.00 L202,117.66 L204,116.63 L206,114.95 L208,112.65 L210,109.80 L212,106.46 L214,102.71 L216,98.65 L218,94.38 L220,90.00 L222,85.62 L224,81.35 L226,77.29 L228,73.54 L230,70.20 L232,67.35 L234,65.05 L236,63.37 L238,62.34 L240,62.00 L242,62.34 L244,63.37 L246,65.05 L248,67.35 L250,70.20 L252,73.54 L254,77.29 L256,81.35 L258,85.62 L260,90.00 L262,94.38 L264,98.65 L266,102.71 L268,106.46 L270,109.80 L272,112.65 L274,114.95 L276,116.63 L278,117.66 L280,118.00 L282,117.66 L284,116.63 L286,114.95 L288,112.65 L290,109.80 L292,106.46 L294,102.71 L296,98.65 L298,94.38 L300,90.00 L302,90.00 L304,90.00 L306,90.00 L308,90.00 L310,90.00 L312,90.00 L314,90.00 L316,90.00 L318,90.00 L320,90.00 L322,90.00 L324,90.00 L326,90.00 L328,90.00 L330,90.00 L332,90.00 L334,90.00 L336,90.00 L338,90.00 L340,90.00 L342,90.00 L344,90.00 L346,90.00 L348,90.00 L350,90.00 L352,90.00 L354,90.00 L356,90.00 L358,90.00 L360,90.00 L362,90.00 L364,90.00 L366,90.00 L368,90.00 L370,90.00 L372,90.00 L374,90.00 L376,90.00 L378,90.00 L380,90.00 L382,90.00 L384,90.00 L386,90.00 L388,90.00 L390,90.00 L392,90.00 L394,90.00 L396,90.00 L398,90.00 L400,90.00 L402,90.00 L404,90.00 L406,90.00 L408,90.00 L410,90.00 L412,90.00 L414,90.00 L416,90.00 L418,90.00 L420,90.00 L422,90.00 L424,90.00 L426,90.00 L428,90.00 L430,90.00 L432,90.00 L434,90.00 L436,90.00 L438,90. te courbe conceptuelle résume les efforts ; elle ne remplace pas les deux signaux thoracique et abdominal d’un enregistrement.</p><button type="button" popovertarget="sommeil-signaux-v1-r2" popovertargetaction="hide">Fermer la définition</button></div><div id="sommeil-signaux-v1-r3" class="definition" popover="manual"><strong>3. Intervalle à comparer (pointillés rouges)</strong><p>Le débit s’interrompt alors que les efforts persistent : mécanisme obstructif illustré.</p><button type="button" popovertarget="sommeil-signaux-v1-r3" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Débit aérien (courbe bleue)</strong> : Lire d’abord le passage de l’air. Les oscillations illustrent une ventilation ; le segment plat représente ici son interruption. Aucun débit chiffré ni signal réel n’est reproduit.</li><li><strong>Effort respiratoire (courbe brune)</strong> : Lire ensuite les mouvements respiratoires. Cette courbe conceptuelle résume les efforts ; elle ne remplace pas les deux signaux thoracique et abdominal d’un enregistrement.</li><li><strong>Intervalle à comparer (pointillés rouges)</strong> : Le débit s’interrompt alors que les efforts persistent : mécanisme obstructif illustré.</li></ol><p><strong>Lecture et pièges :</strong> Le temps va de gauche à droite. Durée, amplitude et fréquence sont arbitraires : ce dessin ne permet ni cotation d’événements ni calcul d’un indice d’apnées-hypopnées. Vérifier la qualité des capteurs avant toute conclusion : une perte de signal peut imiter une interruption. La qualification clinique nécessite un enregistrement interprétable et son contexte.</p></details><details ><summary>Apnée centrale : efforts absents</summary><div class="scene"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Apnée centrale : efforts absents"><rect width="720" height="320" fill="#f5f9fc"/><path d="M140,90.00 L142,85.62 L144,81.35 L146,77.29 L148,73.54 L150,70.20 L152,67.35 L154,65.05 L156,63.3
