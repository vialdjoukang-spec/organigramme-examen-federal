s="nom">Condensation pulmonaire gauche — panneau B</span></button><button type="button" class="repere" style="left:96.450%;top:31.495%" popovertarget="phasea132-condensation-plevre-def2" aria-label="2. Lumières bronchiques aérées — panneau C"><span class="numero">2</span><span class="nom">Lumières bronchiques aérées — panneau C</span></button><button type="button" class="repere" style="left:95.639%;top:90.809%" popovertarget="phasea132-condensation-plevre-def3" aria-label="3. Lame pleurale déclive gauche — panneau D"><span class="numero">3</span><span class="nom">Lame pleurale déclive gauche — panneau D</span></button></div></div></div><div id="phasea132-condensation-plevre-def1" popover="manual" class="definition"><strong>1. Condensation pulmonaire gauche — panneau B</strong><p>Plage dense confluente du poumon gauche, contrastant avec les territoires encore aérés. Le contour situe une portion de la condensation et ne délimite pas tout le lobe ; l’étiologie n’est pas donnée par cette seule opacité.</p><button type="button" popovertarget="phasea132-condensation-plevre-def1" popovertargetaction="hide">Fermer la définition</button></div><div id="phasea132-condensation-plevre-def2" popover="manual" class="definition"><strong>2. Lumières bronchiques aérées — panneau C</strong><p>Petites lumières sombres au sein de la plage pulmonaire opacifiée, concordantes avec le bronchogramme aérien décrit par la source. Leur faible taille limite le tracé des ramifications ; il s’agit d’une localisation, pas d’une segmentation de l’arbre bronchique.</p><button type="button" popovertarget="phasea132-condensation-plevre-def2" popovertargetaction="hide">Fermer la définition</button></div><div id="phasea132-condensation-plevre-def3" popover="manual" class="definition"><strong>3. Lame pleurale déclive gauche — panneau D</strong><p>Petite région de densité liquidienne en périphérie postérieure du poumon gauche, près de la pointe de flèche orange native. La source la décrit comme un petit épanchement pleural ; pas de mesure du volume ni de conclusion sur sa composition.</p><button type="button" popovertarget="phasea132-condensation-plevre-def3" popovertargetaction="hide">Fermer la définition</button></div><ol class="interpretation"><li><strong>Qualité technique</strong> : Quatre coupes sélectionnées, sans série complète. Fenêtres pulmonaire et médiastinale complémentaires. La résolution du panneau986×816pixels limite les petites bronches ; orientation et niveaux sont fournis par la légende source.</li><li><strong>Structures</strong> : Poumons de part et d’autre du médiastin ; à droite de chaque panneau se situe le côté gauche de la patiente. Les coupes A–C montrent différents niveaux thoraciques ; D facilite la lecture de la région pleurale basale.</li><li><strong>Signes sémiologiques</strong> : Opacités gauches hétérogènes et confluentes, plus denses enB/C, avec de petites lumières aériques incluses. Des plages moins denses entourent la condensation. EnD, une petite lame pleurale déclive gauche est indiquée par la flèche source.</li><li><strong>Synthèse syndromique</strong> : Syndrome de condensation pulmonaire gauche avec bronchogramme aérien et petit épanchement pleural homolatéral décrits sur ce scanner d’admission. Les anomalies auscultatoires associées sont rapportées par l’examen clinique, indépendamment des pixels.</li><li><strong>Limites discriminantes</strong> : Le cliché ne prouve ni agent causal, ni infection du liquide, ni nécrose. L’auscultation, l’imagerie et les données cliniques se confrontent ; aucune correspondance sonore univoque ne découle de ce panneau.</li></ol><p>Chez cette patiente de71ans, le compte rendu clinique rapporte indépendamment une diminution des bruits respiratoires à gauche et des sons sous-crépitants dispersés. Les images montrent les anomalies associées ; elles ne permettent pas d’entendre ni de déduire le type exact de bruit. La pointe de flèche orange deD appartient à la figure source.</p><p><strong>Piège :</strong> Une condensation avec bronchogramme aérien ne désigne pas un germe. Une lame liquidienne ne prouve ni empyème ni nature transsudative/exsudative. La nécrose décrite plus tard dans le cas n’est pas attribuée à ce scanner d’admission. Aucun souffle tubaire non documenté, volume pleural ou site de drainage n’est inféré.</p><figcaption>Francisco Dá Mesquita Faustino, Catarina Morgado, Inês Palmares, Joana Ferrão et Paulo Freitas — Cureus2024;16(1):e51527, figure1 ; DOI10.7759/cureus.51527 — CC BY 4.0 — accès 2026-11-02. Panneau complet A–D conservé sans recadrage pour garder les niveaux et la fenêtre médiastinale. Lettres et flèche orange originelles préservées. Copie de droite : trois repères externes, rappels fins et contours pointillés de localisation, sans segmentation exhaustive. <a href="https://europepmc.org/articles/PMC10833058">Source</a> · <a href="https://creativecommons.org/licenses/by/4.0/">Licence</a></figcaption></figure></div></main></body></html>
