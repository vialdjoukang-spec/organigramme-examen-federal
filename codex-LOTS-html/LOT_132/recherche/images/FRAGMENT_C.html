 278,285 269,273" fill="none" stroke="#dc001f" stroke-width="0.5825" stroke-dasharray="1.82031 1.45625"/></svg><button type="button" class="repere" style="left:91.416%;top:44.444%" popovertarget="phasea132-condensation-c-def1" aria-label="1. Condensation pulmonaire gauche"><span class="numero">1</span><span class="nom">Condensation pulmonaire gauche</span></button><button type="button" class="repere" style="left:91.202%;top:82.222%" popovertarget="phasea132-condensation-c-def2" aria-label="2. Lumières bronchiques aérées"><span class="numero">2</span><span class="nom">Lumières bronchiques aérées</span></button></div></div></div><div id="phasea132-condensation-c-def1" popover="manual" class="definition"><strong>1. Condensation pulmonaire gauche</strong><p>Plage parenchymateuse dense et confluente du territoire postérieur gauche. Le tracé situe la plage visible sans prétendre délimiter un lobe complet.</p><button type="button" popovertarget="phasea132-condensation-c-def1" popovertargetaction="hide">Fermer la définition</button></div><div id="phasea132-condensation-c-def2" popover="manual" class="definition"><strong>2. Lumières bronchiques aérées</strong><p>Petites lumières sombres au sein de la condensation : bronchogramme aérien décrit par les auteurs. La résolution ne permet pas une segmentation précise des ramifications.</p><button type="button" popovertarget="phasea132-condensation-c-def2" popovertargetaction="hide">Fermer la définition</button></div><ol class="interpretation"><li><strong>Qualité et orientation</strong> : Coupe sélectionnée, panneau de 466 × 405 pixels. La gauche de la patiente est à droite de l’image. Série complète indisponible.</li><li><strong>Parenchyme</strong> : Plage gauche postérieure dense, hétérogène et confluente (1), contrastant avec le poumon droit aéré sur cette coupe.</li><li><strong>Bronches</strong> : Lumières bronchiques sombres incluses dans la condensation (2), concordantes avec un bronchogramme aérien. Le détail des petites ramifications est limité.</li><li><strong>Synthèse</strong> : Syndrome de condensation pulmonaire gauche avec bronchogramme aérien. L’étiologie nécessite le contexte clinique et les autres explorations ; elle ne découle pas du contour.</li></ol><p>Patiente de 71 ans ; diminution des bruits respiratoires à gauche et sons sous-crépitants rapportés indépendamment par l’examen clinique. Cette image ne permet pas de déduire un son.</p><p><strong>Piège :</strong> Une condensation avec bronchogramme ne désigne pas un germe. Cette coupe isolée ne permet pas de conclure à une nécrose ni de caractériser un liquide pleural.</p><figcaption>Francisco Dá Mesquita Faustino, Catarina Morgado, Inês Palmares, Joana Ferrão et Paulo Freitas — Cureus2024;16(1):e51527, figure1 ; DOI10.7759/cureus.51527 — CC BY 4.0 — accès 2026-11-02. Recadrage du seul panneau C, conservé à gauche sans annotation ajoutée. Copie identique à droite avec deux repères, contours fins et rappels. Original complet conservé dans la preuve source. <a href="https://europepmc.org/articles/PMC10833058">Source</a> · <a href="https://creativecommons.org/licenses/by/4.0/">Licence</a></figcaption></figure>
