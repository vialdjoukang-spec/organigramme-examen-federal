n intraventriculaire"><span class="numero">2</span><span class="nom">Extension intraventriculaire</span></button></div></div></div><div id="phasea-hematome-def1" popover="manual" class="definition"><strong>1. Hématome intraparenchymateux profond droit</strong><p>Plage hyperdense hétérogène au contact du ventricule latéral droit. La localisation caudée est documentée par les auteurs ; le contour reste un repère approximatif.</p><button type="button" popovertarget="phasea-hematome-def1" popovertargetaction="hide">Fermer la définition</button></div><div id="phasea-hematome-def2" popover="manual" class="definition"><strong>2. Extension intraventriculaire</strong><p>Matériel hyperdense dans la portion postérieure du ventricule latéral droit, désigné aussi par la flèche rouge de la source. L’hyperdensité voisine isolée n’est pas incluse dans ce contour.</p><button type="button" popovertarget="phasea-hematome-def2" popovertargetaction="hide">Fermer la définition</button></div><ol class="interpretation"><li><strong>Qualité technique</strong> : Coupe axiale en fenêtre parenchymateuse ; repères R/L lisibles. Image de publication sans DICOM ni échelle de densité. Les flèches originales masquent quelques pixels.</li><li><strong>Structures</strong> : Voûte crânienne, parenchyme et ventricules latéraux sont repérables. La lésion profonde se situe du côté R, à gauche de l’image.</li><li><strong>Signes sémiologiques</strong> : Plage profonde droite nettement hyperdense et hétérogène ; matériel hyperdense dans la portion postérieure du ventricule latéral droit. Contours éditoriaux approximatifs, limités à ces deux plages.</li><li><strong>Synthèse syndromique</strong> : Aspect hémorragique intraparenchymateux avec extension intraventriculaire. Localisation caudée droite confirmée par la légende de la source.</li><li><strong>Limites discriminantes</strong> : La cause du saignement reste indéterminée sur cette coupe. Aucune mesure volumique, quantification de déplacement médian ou exclusion d’hydrocéphalie n’est proposée. Le scanner sélectionné ne représente pas tous les AVC.</li></ol><p>Hématome caudé droit avec extension intraventriculaire selon le cas publié. Les flèches noire et rouge appartiennent à la figure source. Deux repères éditoriaux supplémentaires localisent les plages hyperdenses ; ils ne constituent pas une segmentation.</p><p><strong>Piège :</strong> Toute hyperdensité n’est pas du sang : calcifications et artefacts doivent être distingués. Cette coupe ne détermine ni cause, ni volume de l’hématome, ni conduite thérapeutique ; elle ne permet pas un bilan ventriculaire ou cérébral complet. Elle illustre le versant hémorragique des AVC.</p><figcaption>Brain D. Sindelar, Vimal Patel, Shakeel Chowdhry et Julian E. Bailes — Cureus 2018;10(7):e2976, figure 1A ; DOI 10.7759/cureus.2976 — CC BY 3.0 — accès 2026-11-02. Original complet extrait du PDF conservé sur disque. Panneau A recadré de façon identique dans les deux vues (x0=0, y0=0, x1=624, y1=800), puis même conversion WebP. Flèches et repères source conservés. Sur la copie annotée seulement : contours fins pointillés, numéros périphériques et rappels. <a href="https://europepmc.org/articles/PMC6138459">Source</a> · <a href="https://creativecommons.org/licenses/by/3.0/">Licence</a></figcaption></figure>
