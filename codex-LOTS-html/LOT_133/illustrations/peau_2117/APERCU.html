="3.85156 3.08125"/></svg><button type="button" class="repere" style="left:95.842%;top:54.163%" popovertarget="dx2-purpura-fulminans-def1" aria-label="1. Plage violacée confluente"><span class="numero">1</span><span class="nom">Plage violacée confluente</span></button><button type="button" class="repere" style="left:75.051%;top:60.226%" popovertarget="dx2-purpura-fulminans-def2" aria-label="2. Bord inférieur irrégulier"><span class="numero">2</span><span class="nom">Bord inférieur irrégulier</span></button><button type="button" class="repere" style="left:61.055%;top:75.667%" popovertarget="dx2-purpura-fulminans-def3" aria-label="3. Macule violacée satellite"><span class="numero">3</span><span class="nom">Macule violacée satellite</span></button></div></div></div><div id="dx2-purpura-fulminans-def1" popover="manual" class="definition"><strong>1. Plage violacée confluente</strong><p>Zone centrale sombre et homogène à l’échelle de la photographie ; le contour montre une région intralésionnelle, pas une segmentation de la plaque.</p><button type="button" popovertarget="dx2-purpura-fulminans-def1" popovertargetaction="hide">Fermer la définition</button></div><div id="dx2-purpura-fulminans-def2" popover="manual" class="definition"><strong>2. Bord inférieur irrégulier</strong><p>Transition entre la plage violacée et la peau adjacente. Le petit repère encadre un segment du bord visible ; il ne mesure pas l’extension totale.</p><button type="button" popovertarget="dx2-purpura-fulminans-def2" popovertargetaction="hide">Fermer la définition</button></div><div id="dx2-purpura-fulminans-def3" popover="manual" class="definition"><strong>3. Macule violacée satellite</strong><p>Petite plage violacée distincte sous la plaque principale ; absence d’échelle, sans mesure millimétrique ni test de pression.</p><button type="button" popovertarget="dx2-purpura-fulminans-def3" popovertargetaction="hide">Fermer la définition</button></div><ol class="interpretation"><li><strong>Qualité technique</strong> : Vue rapprochée, exposition hétérogène, résolution 986 × 1237 pixels. Absence d’échelle ; cliché fixe sans test de vitropression.</li><li><strong>Structures et champ</strong> : Peau de cuisse ; limites visibles à droite et en bas, extension hors champ à gauche. La latéralité vient de la légende source.</li><li><strong>Signes sémiologiques</strong> : Vaste plage violacée sombre confluente à bord irrégulier, avec petites macules satellites. Surface luisante et reliefs superficiels ; une nécrose en profondeur ne se juge pas sur ces pixels.</li><li><strong>Synthèse syndromique</strong> : Aspect purpurique étendu dans un cas documenté de purpura fulminans. La progression rapide, les bulles, le choc et la bactériémie sont rapportés dans le dossier publié.</li><li><strong>Limites discriminantes</strong> : Non-effacement à la pression, douleur, palpabilité et vitesse d’extension non évaluables. L’image seule ne démontre ni CIVD ni sepsis ; hémostase, microbiologie et examen clinique restent nécessaires.</li></ol><p>Cas publié de purpura fulminans avec bactériémie à Klebsiella pneumoniae. Les petits contours repèrent des régions d’intérêt ; ils ne délimitent pas toute la lésion.</p><p><strong>Piège :</strong> Le trait sombre externe en haut à droite est compatible avec un marquage cutané : ne pas le prendre pour une limite biologique. La photographie ne prouve ni le germe causal ni une nécrose histologique.</p><figcaption>Ariel Ruiz de Villa, Kipson Charles et Peters Okonoboh — Cureus 2022;14(3):e22921, figure 2. DOI 10.7759/cureus.22921 — CC BY 4.0 — accès 2026-11-02. Original non recadré, présenté en regard. Petits contours pointillés, numéros et rappels fins ajoutés à la copie. <a href="https://europepmc.org/articles/PMC8986515">Source</a> · <a href="https://creativecommons.org/licenses/by/4.0/">Licence</a></figcaption></figure>
