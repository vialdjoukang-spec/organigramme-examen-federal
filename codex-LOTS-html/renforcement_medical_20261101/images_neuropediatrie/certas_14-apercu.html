etaction="hide">Fermer la définition</button></div><div id="lot029-materiel-derivation-certas-def2" popover="manual" class="definition"><strong>2. Segment visible du cathéter</strong><p>Ce trajet tubulaire radio-opaque se prolonge vers le bas de l’image. Le repérage décrit uniquement le segment visible sur ce cliché recadré : il ne prouve pas la continuité de l’ensemble du montage, l’absence d’obstruction ou le sens d’écoulement du liquide cérébrospinal.</p><button type="button" popovertarget="lot029-materiel-derivation-certas-def2" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Marqueurs radio-opaques de la valve</strong> : Les petits éléments très denses regroupés dans cette région constituent des repères visibles du matériel. Le classement Codman Certas Plus provient du dossier du jeu de données, et non d’une identification autonome du modèle ou d’un réglage par cet enseignement.</li><li><strong>Segment visible du cathéter</strong> : Ce trajet tubulaire radio-opaque se prolonge vers le bas de l’image. Le repérage décrit uniquement le segment visible sur ce cliché recadré : il ne prouve pas la continuité de l’ensemble du montage, l’absence d’obstruction ou le sens d’écoulement du liquide cérébrospinal.</li></ol><p>Cliché réel recadré du jeu de données des auteurs, classé Codman Certas Plus. L’étude regroupe des radiographies crâniennes et des images de repérage de scanner ; le fichier individuel ne précise pas sa modalité d’acquisition. Cette comparaison apprend à reconnaître les marqueurs radio-opaques d’une valve et le trajet visible du cathéter chez un patient déjà porteur d’une dérivation. L’âge du patient et l’incidence ne sont pas documentés pour cette image. Aucun diagnostic de lésion cérébrale ne peut en être tiré.</p><p><strong>Piège :</strong> La présence et l’aspect du matériel ne démontrent ni sa perméabilité, ni son bon fonctionnement, ni la pression intracrânienne. Aucun réglage de valve n’est déduit de ce cliché. Une suspicion de dysfonction se raisonne avec les symptômes, les examens antérieurs et l’avis neurochirurgical ; cette image n’est pas un examen initial de toute macrocéphalie.</p><figcaption>Thomas Rhomberg, Felipe Trivik-Barrientos, Arsany Hakim, Andreas Raabe et Michael Murek — CSF Shunt Valves Dataset (2024) — CC BY 4.0 — accès 2026-11-01. Original acquis sans retouche de pixels ; affichage recompressé en WebP. Seule la copie de droite porte des contours rouges pointillés et des repères pédagogiques. Aucun identifiant patient visible. <a href="https://github.com/CSFShuntvalves/xray_csf_shuntvalves/blob/f0937bf54b07a2ba820a5b1c2cfb7c2a86901576/codman_certas_plus/certas_14.png">Source</a> · <a href="https://creativecommons.org/licenses/by/4.0/">Licence</a></figcaption></figure></body></html>
