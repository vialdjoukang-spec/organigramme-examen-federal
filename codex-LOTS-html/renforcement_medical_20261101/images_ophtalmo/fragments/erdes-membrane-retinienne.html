l" class="definition"><strong>1. Membrane échogène intravitréenne</strong><p>Structure linéaire et curviligne plus claire que le vitré environnant, située dans la cavité vitréenne et se prolongeant vers la paroi postérieure. Elle est présente dans ce panneau classé « décollement rétinien » par les auteurs. Le contour souligne la membrane visible, sans attribuer de nom anatomique à son point de jonction postérieur.</p><button type="button" popovertarget="lot018-erdes-membrane-retinienne-def1" popovertargetaction="hide">Fermer la définition</button></div><ol><li><strong>Membrane échogène intravitréenne</strong> : Structure linéaire et curviligne plus claire que le vitré environnant, située dans la cavité vitréenne et se prolongeant vers la paroi postérieure. Elle est présente dans ce panneau classé « décollement rétinien » par les auteurs. Le contour souligne la membrane visible, sans attribuer de nom anatomique à son point de jonction postérieur.</li></ol><p>Le cinquième panneau de la planche ERDES porte une coche « presence of retinal retina detachment » dans la source. Le repère 1 montre la membrane échogène courbe visible dans la cavité vitréenne. Le cliché permet de reconnaître cette membrane ; il ne permet pas à lui seul de déterminer le statut maculaire, la localisation d’une déchirure ou l’œil concerné. L’original non annoté est placé à gauche, sa copie annotée à droite.</p><p><strong>Piège :</strong> Une membrane échogène n’est pas, isolément, une preuve suffisante de décollement rétinien : le décollement postérieur du vitré entre dans le diagnostic différentiel. La dynamique, les attaches et le contexte ophtalmologique doivent être confrontés à l’examen complet. Ne pas identifier ici la papille ou la macula : elles ne sont pas suffisamment repérables sur cette image statique de faible définition.</p><figcaption>Yasemin Ozkut, Pouyan Navard, Srikar Adhikari, Elaine Situ-LaCasse, Josie Acuña, Adrienne A. Yarnish et Alper Yilmaz — ERDES — CC BY 4.0 — accès 2026-11-01. Recadrage du cinquième panneau de la planche originale, sans retouche des pixels cliniques. À droite seulement : contour pointillé rouge et numéro ajoutés. Résolution native du panneau : 200 × 200 pixels ; agrandissement à l’écran sans apport de détails. <a href="https://github.com/OSUPCVLab/ERDES/blob/4af67e0b9f4667edbae75a64a819884ee14d7a3b/docs/media/labeling_rd.png">Source</a> · <a href="https://creativecommons.org/licenses/by/4.0/">Licence</a></figcaption></figure>
