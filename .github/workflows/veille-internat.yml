# Veille INTERNAT : examen fédéral, santé publique (7 jours), sociétés savantes.
# Prolonge ve1/ve2 (Argos) : même sources.yml, même script veille.py pour les
# empreintes, même branche veille-etat (main est protégée).
# Aucune API payante, aucun modèle de langage. Une fois par jour au plus.
# Ce workflow n'écrit que sur la branche veille-etat, jamais sur main : il est
# donc indépendant du verrou mission_exclusive (laissé à ve1/ve2, non modifié).
# La page publique recharge les données de veille-etat à chaque ouverture.
# Un déclenchement de pages.yml met seulement à jour la version embarquée.
name: Veille INTERNAT · pages publiques
on:
  schedule:
    - cron: '17 6 * * *'   # chaque jour 06:17 UTC (après ve1 à 05:17)
  workflow_dispatch:
permissions:
  contents: write   # commit de veille/pages/* sur la branche veille-etat
  actions: write    # déclenche Pages + réactivation mensuelle
concurrency:
  group: veille-etat
  cancel-in-progress: false
jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Récupérer l'état précédent (branche veille-etat)
        run: |
          mkdir -p veille/pages
          if git fetch --depth=1 origin veille-etat 2>/dev/null; then
            git show FETCH_HEAD:veille/pages/empreintes.json > veille/pages/empreintes.json 2>/dev/null || true
            git show FETCH_HEAD:veille/etat.json > veille/etat.json 2>/dev/null || true
          fi
      - name: Collecter les sources et rendre la page
        run: |
          python3 veille/collecter_pages.py \
            --sources veille/sources.yml \
            --etat veille/pages/empreintes.json \
            --sortie-html veille/pages/index.html \
            --sortie-json veille/pages/donnees.json
      - name: Enregistrer la page sur veille-etat (pas sur main)
        if: always()
        run: |
          [ -f veille/pages/index.html ] || exit 0
          mkdir -p /tmp/pages-veille
          cp -a veille/pages/. /tmp/pages-veille/
          # Conserve aussi etat.json d'Argos (ve1/ve2) s'il est déjà sur la branche.
          git config user.name "argos-veille[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin veille-etat 2>/dev/null; then
            git checkout -q -f -B veille-etat FETCH_HEAD
          else
            git checkout -q --orphan veille-etat
            git rm -rqf . || true
          fi
          mkdir -p veille/pages
          cp -a /tmp/pages-veille/. veille/pages/
          git add veille/pages/index.html veille/pages/donnees.json veille/pages/empreintes.json
          git diff --cached --quiet || git commit -qm "veille(internat): actualise la page publique"
          git push -q origin veille-etat
      - name: Publier via le workflow Pages
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          echo "Pages relancé."
      - name: Réactivation mensuelle (parade aux 60 jours)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if [ "$(date -u +%d)" -le 7 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/veille-internat.yml/enable" && echo "Workflow réactivé."
          fi
