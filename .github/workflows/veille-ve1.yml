# Veille ve1 (Argos, phase 1), tirée de tools/templates/veille-squelette.yml.
# Écart au squelette : main est protégée (demande de fusion exigée), si bien que l'état des
# empreintes s'enregistre sur la branche non protégée « veille-etat » et non sur main.
# Parade aux 60 jours d'inactivité [G2] : le premier lundi du mois, le workflow se réactive
# lui-même par l'API (PUT …/enable) et commite son état sur veille-etat.
# Règles : robots.txt lu avant chaque requête ; Compendium jamais automatisé (I8) ; aucun texte protégé copié.
name: Veille Ve1 · OFSP examen et inscription
on:
  schedule:
    - cron: '17 5 * * *'   # chaque jour 05:17 UTC ; le script ne lit que le lundi, et chaque jour du 1.12 au 31.03
  workflow_dispatch:
permissions:
  contents: write   # commit de veille/etat.json sur la branche veille-etat
  issues: write     # ticket seulement si l'empreinte change, ou après deux échecs
  actions: write    # réactivation mensuelle du workflow (parade aux 60 jours)
concurrency:
  group: veille-etat
  cancel-in-progress: false
jobs:
  perimetre:
    runs-on: ubuntu-latest
    outputs:
      autorise: ${{ steps.mission.outputs.autorise }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - id: mission
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path("tools/coordination/config.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("autorise="+str(c.get("mission_exclusive")!="infobulles_prototype6").lower(), file=f)
          PY
  veille:
    needs: perimetre
    if: needs.perimetre.outputs.autorise == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Récupérer l'état précédent (branche veille-etat)
        run: |
          if git fetch --depth=1 origin veille-etat 2>/dev/null; then
            git show FETCH_HEAD:veille/etat.json > veille/etat.json 2>/dev/null || true
          fi
      - name: Comparer l'empreinte normalisée (titres, liens et dates seulement)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python3 veille/veille.py --id ve1 --sources veille/sources.yml --etat veille/etat.json
      - name: Enregistrer l'état sur veille-etat
        if: always()
        run: |
          [ -f veille/etat.json ] || exit 0
          cp veille/etat.json /tmp/etat.json
          git config user.name "argos-veille[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f veille/etat.json
          if git fetch --depth=1 origin veille-etat 2>/dev/null; then git checkout -q -f -B veille-etat FETCH_HEAD; else git checkout -q --orphan veille-etat && git rm -rqf . ; fi
          mkdir -p veille && cp /tmp/etat.json veille/etat.json
          git add veille/etat.json
          git diff --cached --quiet || git commit -qm "veille(ve1): état des empreintes"
          git push -q origin veille-etat
      - name: Réactivation mensuelle (parade aux 60 jours)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if [ "$(date -u +%d)" -le 7 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/veille-ve1.yml/enable" && echo "Workflow réactivé."
          fi
