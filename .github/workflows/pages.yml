# Publication GitHub Pages (Héphaïstos) : seule l'application est publiée.
# index.html et app_v2.html sont deux copies du même fichier de travail.
name: Pages
on:
  push:
    branches: [main]
    paths: [app_v2.html, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir _site
          cp app_v2.html _site/index.html
          cp app_v2.html _site/app_v2.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v5
