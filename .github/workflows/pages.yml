# Publication GitHub Pages (Héphaïstos) : l'application et ses croquis (assets/) sont publiés.
# index.html et app_v2.html sont deux copies du même fichier de travail ; progres.html affiche les jauges des binômes.
# Après une fusion faite avec GITHUB_TOKEN (auto-fusion), le workflow
# pages-apres-fusion.yml relance celui-ci via workflow_dispatch : une fusion
# GITHUB_TOKEN ne déclenche pas on:push, et l'environnement github-pages
# refuse un déploiement lancé depuis un événement pull_request.
name: Pages
on:
  push:
    branches: [main]
    paths: [app_v2.html, progres.html, 'assets/**', 'tools/coordination/**', .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: automates/prevalences
          path: .etat_local/prevalences
          persist-credentials: false
      - name: Suivi commun monographies et prévalences
        run: python3 tools/coordination/calculer.py --output .etat_local/coordination
      - run: |
          mkdir _site
          cp app_v2.html _site/index.html
          cp app_v2.html _site/app_v2.html
          cp progres.html _site/progres.html
          cp .etat_local/coordination/coordination.html _site/coordination.html
          cp .etat_local/coordination/coordination.json _site/coordination.json
          cp .etat_local/prevalences/jauges.html _site/prevalences.html
          cp .etat_local/prevalences/jauges.json _site/prevalences.json
          if [ -f .etat_local/prevalences/erreurs.pdf ]; then cp .etat_local/prevalences/erreurs.pdf _site/prevalences-erreurs.pdf; fi
          if [ -f .etat_local/prevalences/erreurs.json ]; then cp .etat_local/prevalences/erreurs.json _site/prevalences-erreurs.json; fi
          if [ -d assets ]; then cp -r assets _site/assets; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v5
