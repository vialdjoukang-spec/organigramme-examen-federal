# Ancien garde en secours manuel désactivé ; relais actif : codex-cloud-120.yml.
# Ordre de Vial : « Codex doit être libre, indépendant de tout PC ».
# Mesure le contenu réel de main ; STALL si rien n'a monté en 2 min (ou seulement des relevés) :
# « @codex » sur la PR brouillon « Pilote Codex » (≤ 1/2 min), puis @vialdjoukang-spec après30stalls (≤ 1/60 min).
# Recycle aussi les PR inactives depuis 60 min. Seuils : tools/garde/config.json. État : branche garde/etat.
# Jetons : AUTO_FUSION_TOKEN (compte de Vial → déclenche l'intégration Codex) pour les « @codex » ;
# GITHUB_TOKEN (github-actions[bot]) pour mentionner Vial, sinon GitHub ne lui envoie pas de courriel.
name: Garde du progrès
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: garde-progres
  cancel-in-progress: false
jobs:
  garde-progres:
    name: garde-progres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v7
        with:
          ref: automates/prevalences
          path: .etat_local/prevalences
          persist-credentials: false
      - name: Veille infobulles bornée, main actualisé à chaque passage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_BOT: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_CODEX: ${{ secrets.AUTO_FUSION_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/garde/permanence.py --window 1200 --refresh-main --github-state --notifier
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coordination-8-9
          path: |
            .etat_local/coordination/
            .etat_local/permanence/etat.json
          retention-days: 3
