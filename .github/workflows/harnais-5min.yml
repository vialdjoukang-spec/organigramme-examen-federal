name: Harnais · contrôle fonctionnel toutes les 5 min
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/harnais-5min.yml'
      - 'harnais/surveillance/**'
      - 'tests/harnais_surveillance/**'
      - 'harnais/pilotage_lots/**'
      - 'tests/pilotage_lots/**'
permissions:
  contents: read
concurrency:
  group: harnais-5min-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false
jobs:
  verifier:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: harnais/surveillance/runtime-requirements.txt
      - name: Tester les faux positifs et les preuves périmées
        run: python -m unittest discover -s tests/harnais_surveillance -p 'test_*.py' -v
      - name: Tester les portes V8 et les collisions de reprise
        run: python -m unittest discover -s tests/pilotage_lots -p 'test_*.py' -v
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/huggingface/hub
          key: harnais-llmlingua-cpu-5f0c82792b7ea14c6484e015b6a072009496b7f2
      - name: Installer les outils testés sur CPU sans API payante
        run: |
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r harnais/surveillance/runtime-requirements.txt
      - name: Exécuter réellement découpage, cache et compression
        run: python harnais/surveillance/runtime_probe.py --agent GITHUB_RUNNER --output /tmp/harnais-runtime.json
      - name: Contrôler les preuves publiées des deux agents
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python harnais/surveillance/watchdog.py --output /tmp/harnais-watchdog.json
      - name: Publier le bilan fonctionnel du runner
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path('/tmp/harnais-runtime.json')
          r=json.loads(f.read_text()) if f.exists() else {'complete':False,'error':'Test non exécuté ou installation échouée.'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n## Test réel sur le runner GitHub\n\n```json\n'+json.dumps(r,ensure_ascii=False,indent=2)+'\n```\n')
              out.write('\nLe runner ne renouvelle aucun signal d’activité des agents et ne modifie aucun lot.\n')
          PY
      - name: Lire le registre inverse et proposer la prochaine action sans écrire
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python harnais/pilotage_lots/cli.py --output /tmp/lots-pilotage.json
