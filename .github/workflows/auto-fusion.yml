# Auto-fusion après audit (label audit-ok).
# Les rédacteurs ouvrent leur PR sans fusionner. L'auditeur pousse ses
# corrections sur la branche et ajoute le label audit-ok. Ce workflow
# applique une autorisation technique de main puis fusionne immédiatement
# par commit de fusion, seulement lorsque tous les contrôles sont déjà verts.
# Aucune autorisation différée d'auto-merge ne subsiste après ce passage. La publication Pages est déclenchée par pages.yml (y compris
# sur pull_request fermée et fusionnée), car une fusion faite avec
# GITHUB_TOKEN ne relance pas les workflows push.
# GH_REPO est fixé (aucun dépôt local : « not a git repository » sinon). Si le secret
# AUTO_FUSION_TOKEN (PAT fin) existe, il remplace GITHUB_TOKEN. Aucune mise à jour
# automatique de branche ne remplace le SHA explicitement autorisé sur main.
name: Auto-fusion
on:
  # Le YAML est lui aussi fourni par la branche de base de confiance.
  pull_request_target:
    types: [labeled, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-fusion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-fusion:
    name: auto-fusion
    if: >
      github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'attente-vial') &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'audit-ok') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'audit-ok'))
      )
    runs-on: ubuntu-latest
    steps:
      # Le code de décision vient exclusivement de main, jamais de la PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Vérifier le mandat, l'autorisation technique et la CI du SHA exact
        id: ordre
        env:
          GH_TOKEN: ${{ secrets.AUTO_FUSION_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/predecesseurs_fusion.py "$PR" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Fusionner immédiatement le SHA technique explicitement autorisé
        if: steps.ordre.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_FUSION_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Relire main et la tête juste avant mutation ; aucune mise à jour automatique
          # ne peut remplacer le SHA qui porte l'audit et l'autorisation.
          python3 tools/predecesseurs_fusion.py "$PR" --head "$HEAD_SHA" --check
          gh pr merge "$PR" --repo "$GH_REPO" --merge --match-head-commit "$HEAD_SHA"
