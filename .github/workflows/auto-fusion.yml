# Auto-fusion après audit (label audit-ok).
# Les rédacteurs ouvrent leur PR sans fusionner. L'auditeur pousse ses
# corrections sur la branche et ajoute le label audit-ok. Ce workflow
# active l'auto-merge (commit de fusion). GitHub fusionne dès que les
# contrôles requis sont verts et que la branche est à jour (strict).
#
# Ne PAS mettre à jour la branche avec GITHUB_TOKEN : ce push ne relance
# pas la CI (événements GITHUB_TOKEN) et laisse les contrôles requis
# bloqués en action_required. Si la PR est en retard, commenter et
# laisser l'auditeur / le rédacteur cliquer « Update branch » (jeton
# utilisateur) ; l'auto-merge reste armé et finalise ensuite.
#
# GH_REPO + GH_TOKEN : `gh pr merge --auto` sans dépôt git local.
# Publication : pages-apres-fusion.yml → workflow_dispatch de pages.yml.
name: Auto-fusion
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-fusion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-fusion:
    name: auto-fusion
    if: >
      github.event.pull_request.merged == false &&
      github.event.pull_request.draft == false &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'audit-ok') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'audit-ok'))
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Activer l'auto-merge (commit de fusion)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          meta=$(gh pr view "$PR" --json mergeStateStatus,state,autoMergeRequest \
            --jq '{status:.mergeStateStatus,state,auto:.autoMergeRequest.enabledAt}')
          echo "PR #${PR} : ${meta}"
          status=$(echo "$meta" | jq -r .status)
          if [ "$status" = "BEHIND" ]; then
            gh pr comment "$PR" --body "$(cat <<'MD'
          **Auto-fusion** : branche en retard sur `main`.

          Cliquez **Update branch** (jeton utilisateur — pas le bot), laissez la CI repasser au vert. L'auto-merge est armé et fusionnera ensuite tout seul.
          MD
          )" || true
          fi
          set +e
          out=$(gh pr merge "$PR" --auto --merge 2>&1)
          rc=$?
          set -e
          echo "gh pr merge --auto rc=${rc} out=${out}"
          if [ "$rc" -eq 0 ]; then
            echo "Auto-merge activé pour #${PR}."
            exit 0
          fi
          state=$(gh pr view "$PR" --json state,autoMergeRequest,mergeable,mergeStateStatus \
            --jq '{state,autoEnabled:.autoMergeRequest.enabledAt,mergeable,mergeStateStatus}')
          echo "État après échec : ${state}"
          echo "$state" | grep -q '"state":"MERGED"' && { echo "Déjà fusionnée."; exit 0; }
          echo "$state" | grep -q '"autoEnabled":"' && { echo "Auto-merge déjà actif."; exit 0; }
          echo "$out" | grep -qiE 'already enabled|auto.?merge' && {
            echo "Auto-merge déjà actif (message gh)."
            exit 0
          }
          exit 1
