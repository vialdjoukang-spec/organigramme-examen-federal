# CI · Héphaïstos (socle) et Janus (contrôles). Chaque demande de fusion vers main
# doit réussir les tâches garde, html et tests avant qu'Athéna ne fusionne (I7).
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  garde:
    name: garde
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Empreinte de orig/app.html (interdit I1)
        run: python3 tools/check_hash.py
      - name: Aucune modification de orig/ dans la demande de fusion
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^orig/'; then
            echo "ÉCHEC : la demande de fusion modifie orig/ (interdit I1)."; exit 1; fi
          echo "orig/ intact."
      - name: Budgets de taille (app_v2.html ≤ 6 Mo, image ≤ 200 Ko)
        run: python3 tools/budget.py
      - name: Tests des gardes elles-mêmes
        run: python3 tests/test_gardes.py
      - name: File de fusion · contrôles requis, attente-vial et réessai Pages
        run: python3 tests/test_file_fusion.py
      # Chantier Nerfs crâniens et CK (Atlas, Janus, Galien) : audit médical de niveau 1, zéro jeton.
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Dépendances de l'audit (jsonschema, pyyaml)
        run: pip install --quiet jsonschema pyyaml
      - name: G5 · schémas, renvois croisés et chaîne complète ; assets/ck à jour
        run: python tools/ck_build.py --check
      - name: Stations CS · schéma, renvois (SSP, GES, hyp, src), dates de lecture, aucune dose chiffrée ; assets/st à jour
        run: python tools/cs_build.py --check
      - name: Prévalence des différentiels · chiffre sourcé et daté, ≤ 100 %, ordre décroissant ; PRV et assets/ck/prev.js à jour
        run: python tools/prev_build.py --check
      - name: Monographies des différentiels (Hygie)
        run: python tools/mono_build.py --check
      - name: G1 · doses contre la table suisse
        run: python tools/audit/niveau1.py --only G1
      - name: Table suisse des doses · extrait AIPS verbatim, URL, dates, nombres présents dans l'extrait (Pharmakon)
        run: python tools/doses_check.py
      - name: G2 · source et date de lecture
        run: python tools/audit/niveau1.py --only G2
      - name: G3 · domaines sur liste blanche suisse et européenne
        run: python tools/audit/niveau1.py --only G3
      - name: G4 · Lyncée, aucun terme nouveau non défini (la référence ne peut que baisser)
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python tools/lyncee.py --diff "origin/${{ github.base_ref }}"
          else
            python tools/lyncee.py
          fi
      - name: G6 · phrases sans verbe conjugué
        run: python tools/audit/niveau1.py --only G6
      - name: G7 · rouge réservé aux éléments bloquants
        run: python tools/audit/niveau1.py --only G7
      - name: G8 · justification (mécanisme, principe, pourquoi ce choix, limites)
        run: python tools/audit/niveau1.py --only G8
      - name: Rapport des fautes à jour, faute critique soumise à l'accord de Vial
        run: python tools/audit/rapport_fautes.py --check
      - name: Schémas SVG des nerfs (couches, poids, crédits)
        run: python tools/nc_svg_check.py
      - name: Tests du socle CK et de l'audit (chaque contrôle échoue quand sa règle est violée)
        run: python tests/test_ck.py
      - name: Signalements du niveau 1 (artefact audit-flags)
        if: always()
        run: python tools/audit/niveau1.py --sortie qa/audit-flags.json || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-flags
          path: qa/audit-flags.json
          retention-days: 30

  etiquette:
    name: etiquette
    # Demande la revue clinique de niveau 2 (Galien) quand une demande de fusion touche data/ck, data/cs ou assets/nc.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(data/ck/|data/cs/|assets/nc/)'; then
            gh label create audit:galien --color 0E8A16 --description "Revue clinique de niveau 2 par Galien" 2>/dev/null || true
            gh pr edit ${{ github.event.pull_request.number }} --add-label audit:galien
          else
            echo "Aucune donnée clinique CK modifiée : pas de revue de niveau 2."
          fi

  html:
    name: html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validateur Nu (version figée tant que ci.yml ne change pas)
        uses: actions/cache@v6
        id: vnu
        with:
          path: vnu-runtime-image
          key: vnu-linux-${{ hashFiles('.github/workflows/ci.yml') }}
      - if: steps.vnu.outputs.cache-hit != 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release download latest --repo validator/validator -p vnu.linux.zip
          unzip -q vnu.linux.zip
      - name: Aucune erreur HTML nouvelle par rapport à qa/html-baseline.json
        run: |
          ./vnu-runtime-image/bin/vnu --errors-only --format json app_v2.html 2> vnu.json || true
          python3 tools/html_check.py vnu.json

  liens:
    name: liens
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: URL ajoutées ou modifiées
        id: list
        run: |
          python3 tools/links_changed.py "origin/${{ github.base_ref }}"
          echo "n=$(grep -c . links.txt || true)" >> "$GITHUB_OUTPUT"
      - name: Contrôle des liens modifiés (lychee)
        if: steps.list.outputs.n != '0'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --timeout 20 --accept 200..=299,403,429 links.txt
          fail: true

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Playwright et Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: 43 contrôles d'interaction (référence verte)
        run: python tests/run_tests.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-tests
          path: qa/shots/
          retention-days: 7

  # Chantier Nerfs crâniens · Dédale : schémas dérivés par automate (couches, lisibilité à 360 px, poids,
  # crédits « œuvre dérivée », couleur, rejeu à l'octet par annoter.py + svgo 4.0.0 figé).
  schemas:
    name: schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Dépendances (pyyaml, svgo 4.0.0)
        run: |
          pip install --quiet pyyaml
          npm install --global --silent svgo@4.0.0
          svgo --version
      - name: Dédale-V · contrôle des schémas assets/nc
        run: python tools/dedale/verifier.py --tous
      - name: Tests des contrôles de Dédale (chaque règle violée fait échouer)
        run: python tests/test_dedale.py
      - name: Schémas intégrables hors ligne (assets/nc/ncXX.js à jour, tools/nc_svg_js.py)
        run: python tools/nc_svg_js.py --check
