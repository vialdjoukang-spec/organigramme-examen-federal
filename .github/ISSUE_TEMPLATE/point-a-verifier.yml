name: Point à vérifier
description: Une affirmation qu’aucune source officielle lue ne confirme encore (Thémis, Asclépios, Janus).
title: "[À vérifier] <point>"
labels: ["a-verifier"]
body:
  - type: textarea
    id: point
    attributes: { label: Point, description: L’affirmation à confirmer, en une phrase verbale. }
    validations: { required: true }
  - type: textarea
    id: lu
    attributes: { label: Sources déjà lues, description: Chaque source avec son URL, son paragraphe et sa date de lecture. }
    validations: { required: true }
  - type: input
    id: autorite
    attributes: { label: Autorité à consulter, description: L’autorité ou la source primaire qui peut trancher. }
    validations: { required: true }
  - type: input
    id: impact
    attributes: { label: Effet dans l’application, description: L’onglet et l’élément qui dépendent de ce point. }
    validations: { required: true }
