# Sources de la veille officielle (Argos, phase 1). Annexe D du plan v2, testée le 17.10.2026.
# Chaque requête lit d'abord robots.txt ; aucune source n'est le Compendium ni une page Swissmedic.
ve1:
  nom: "OFSP · examen fédéral et inscription"
  categorie: veille:officiel
  destinataire: Thémis
  methode: html          # titres et liens de la zone <main>, liens PDF compris
  hebdo_jour: 0          # lundi (0 = lundi)
  quotidien: ["12-01", "03-31"]   # chaque jour du 1.12 au 31.03
  urls:
    - https://www.bag.admin.ch/fr/examen-federal-en-medecine-humaine
    - https://www.bag.admin.ch/fr/inscription-a-lexamen-federal
ve2:
  nom: "Portail healthreg · inscription à l'examen"
  categorie: veille:officiel
  destinataire: Thémis
  methode: playwright    # la page n'affiche ses dates qu'avec JavaScript
  hebdo_jour: 0
  urls:
    - https://healthreg-online.admin.ch/examination-registration

# ---------------------------------------------------------------------------
# Veille INTERNAT (pages publiques du jeu). Vérifiées par HTTP le 17.11.2026.
# Ces sources s'ajoutent à ve1 et ve2 ; elles ne les remplacent pas.
# Le collecteur (veille/collecter_pages.py) relit chaque URL à chaque run :
# un code autre que 200, un échec TLS ou un écran anti-robot marque la source
# « non accessible ». Aucune URL n'est inventée.
# Swissmedic : communications officielles seulement, jamais le Compendium.
# ---------------------------------------------------------------------------
