# Liste blanche des domaines cités par les données CK (contrôle G3, tools/audit/niveau1.py).
# Ordre de priorité : Suisse, puis Europe. « anatomie » n'est admis que pour une source de type anatomie.
# doi.org et europepmc.org sont admis ; G3 exige alors un éditeur suisse ou européen (champs org et pays de src.json).
# Origine : propositions/domaines.yml du plan Nerfs crâniens et CK (17.10.2026). medicalforum.ch a été retiré
# (pas de réponse le 17.10.2026) ; escardio.org, has-sante.fr et escmid.org bloquent les requêtes automatiques
# et restent à confirmer à la main par Argos.
# Ajouts de Galien du 17.10.2026, motivés, à confirmer par Vial et par Argos :
#   swissmedicinfo-pro.ch : hôte réel de l'information professionnelle suisse (AIPS) lue à la main.
#   cen-neurologie.fr : Collège des Enseignants de Neurologie, référentiel français de sémiologie neurologique.
#   sfendocrino.org : Société Française d'Endocrinologie, référentiel CEEDMM (item 244, hypercortisolisme).
# Ajouts de Podalire du 17.10.2026 (lot 2 des urgences), motivés, à confirmer par Vial et par Argos :
#   liguepulmonaire.ch : Ligue pulmonaire suisse, éditrice du Guide de poche BPCO avec la Société Suisse de Pneumologie.
#   abcd.care : hôte officiel des lignes directrices JBDS (Joint British Diabetes Societies for Inpatient Care), sans DOI pour la révision 2023.
# Ajouts de Chiron du 17.10.2026 (stations CS), à confirmer par Vial et par Argos :
#   fmh.ch : hôte du guide ASSM/FMH « Bases juridiques pour le quotidien médical » (leitfaden.samw.fmh.ch).
#   paediatrieschweiz.ch : pädiatrie schweiz, société suisse de pédiatrie (Paediatrica).
#   kispi-wiki.ch : directives cliniques du Kinderspital de Zurich.
#   revmed.ch : Revue Médicale Suisse.
