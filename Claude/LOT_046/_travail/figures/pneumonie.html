<div class="p"><b>Lecture guidée.</b><ol><li><b>1.</b> La condensation du champ pulmonaire droit du cliché efface le bord cardiaque droit.</li><li><b>2.</b> Le bord gauche du cœur et le lobe inférieur gauche restent relativement clairs.</li><li><b>3.</b> La trachée reste médiane, sans déviation vers un collapsus massif.</li></ol></div><div class="p"><b>Pièges.</b><ul><li>La flèche rouge appartient au fichier publié : elle ne remplace pas la lecture systématique des deux champs.</li><li>La culture nasopharyngée citée par l’auteur ne prouve pas le germe du foyer, donc l’image ne nomme pas la bactérie.</li><li>Un cliché normal n’exclut pas une pneumonie débutante chez la personne âgée.</li></ul></div>
<p class="p"><b>Ce que l'image décide.</b> Une nouvelle condensation lobaire confirme la pneumonie avérée et fait débuter l’antibiotique, alors que l’absence de foyer oriente vers une bronchite si le patient est stable.</p>
