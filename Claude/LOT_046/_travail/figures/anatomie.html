<div class="paire"><div><img src="images/2312_Gross_Anatomy_of_the_Lungs.webp" width="1000" height="688" alt="Anatomie macroscopique des poumons — cliché brut" loading="lazy"><p class="p">Lisez d'abord seul ce cliché (anatomie macroscopique des poumons) : cherchez vous-même le signe.</p></div>
<div><svg viewBox="0 0 1000 688" role="img" aria-label="Anatomie macroscopique des poumons — copie annotée"><image href="images/2312_Gross_Anatomy_of_the_Lungs.webp" width="1000" height="688"/><circle cx="500" cy="55" r="35" fill="none" stroke="#b00020" stroke-width="6.0" stroke-dasharray="15"/><text x="540" y="55" font-size="45" font-weight="700" fill="#b00020" stroke="#fff" stroke-width="4.0">1</text><circle cx="220" cy="468" r="35" fill="none" stroke="#b00020" stroke-width="6.0" stroke-dasharray="15"/><text x="260" y="468" font-size="45" font-weight="700" fill="#b00020" stroke="#fff" stroke-width="4.0">2</text><circle cx="720" cy="378" r="35" fill="none" stroke="#b00020" stroke-width="6.0" stroke-dasharray="15"/><text x="760" y="378" font-size="45" font-weight="700" fill="#b00020" stroke="#fff" stroke-width="4.0">3</text><circle cx="580" cy="248" r="35" fill="none" stroke="#b00020" stroke-width="6.0" stroke-dasharray="15"/><text x="620" y="248" font-size="45" font-weight="700" fill="#b00020" stroke="#fff" stroke-width="4.0">4</text></svg><p class="p">La copie annotée (anatomie macroscopique des poumons) numérote les repères décrits ci-dessous.</p></div></div>
<div class="p"><b>Lecture guidée.</b><ol><li><b>1.</b> La trachée descend au centre et se divise en deux bronches souches.</li><li><b>2.</b> Le poumon droit porte un lobe moyen, entre le lobe supérieur et le lobe inférieur.</li><li><b>3.</b> Le poumon gauche présente une incisure cardiaque et ne compte que deux lobes.</li><li><b>4.</b> La bronche lobaire se divise ensuite en bronches segmentaires.</li></ol></div><div class="p"><b>Pièges.</b><ul><li>Les légendes du schéma sont en anglais, donc le lobe moyen ne se cherche que du côté droit.</li><li>Le schéma ne montre ni le diaphragme ni les vaisseaux, et il ne localise pas une condensation.</li></ul></div>
<p class="p"><b>Ce que l'image décide.</b> Le médecin ausculte et percute lobe par lobe, car un foyer du lobe moyen droit efface le bord droit du cœur, alors qu’un foyer basal efface le diaphragme.</p>
