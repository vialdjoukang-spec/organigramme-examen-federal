<div class="p"><b>Lecture guidée.</b><ol><li><b>1.</b> L’alvéole est l’espace aérien où se fait l’échange, entouré de capillaires.</li><li><b>2.</b> Le capillaire longe la membrane respiratoire, très mince chez le sujet sain.</li><li><b>3.</b> Le sac alvéolaire réunit plusieurs alvéoles au bout du canal alvéolaire.</li><li><b>4.</b> Les vaisseaux sanguins de la cloison sont visibles sur la coupe histologique.</li></ol></div><div class="p"><b>Pièges.</b><ul><li>Le schéma montre l’alvéole saine, donc il ne montre pas le comblement purulent d’une pneumonie.</li><li>La coupe histologique ne distingue pas un exsudat infectieux d’un œdème.</li></ul></div>
<p class="p"><b>Ce que l'image décide.</b> L’antibiotique vise le germe dans l’alvéole, alors que l’oxygène corrige le trouble d’échange tant que les alvéoles restent comblées.</p>
