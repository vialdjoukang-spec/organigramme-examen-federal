<div class="p"><b>Lecture guidée.</b><ol><li><b>1.</b> La silhouette cardiaque est élargie et occupe une grande partie du thorax inférieur.</li><li><b>2.</b> Les deux bases sont le siège d’opacités interstitielles diffuses, sans foyer lobaire unique.</li><li><b>3.</b> Des fils de sternotomie sont visibles sur la ligne médiane.</li></ol></div><div class="p"><b>Pièges.</b><ul><li>Ce cliché n’exclut ni un syndrome coronarien ni une embolie pulmonaire, car ces deux diagnostics se jugent par l’électrocardiogramme et par l’angioscanner.</li><li>Les lignes de Kerley décrites par l’auteur sont fines : un cliché compressé ne permet pas de les compter une à une.</li></ul></div>
<p class="p"><b>Ce que l'image décide.</b> L’aspect bilatéral avec cœur élargi oriente vers l’œdème cardiogénique et fait débuter l’oxygène et le diurétique, tout en obtenant un électrocardiogramme sans délai.</p>
