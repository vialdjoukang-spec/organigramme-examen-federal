<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Parcours urgence et refus</title>
<style>
@font-face { font-family: Atk; src: url("../../outils/dessinateur/polices/AtkinsonHyperlegible-Regular.ttf"); }
body { margin: 1rem; font-family: Atk, Verdana, sans-serif; background:#eef7fc; color:#1d2a30; }
h1 { font-size: 1.3rem; }
svg { width: min(100%, 760px); height: auto; background: white; border: 1px solid #cfe3ec; }
.schema .etape rect { fill: #fff; stroke: #176fa0; stroke-width: 1.6; }
.schema .etape:hover rect, .schema .etape:focus rect, .schema .etape:target rect { stroke: #a1262f; stroke-width: 3; }
text { font-family: Atk, Verdana, sans-serif; fill: #1d2a30; }
a { color: #0b5d86; }
</style></head><body>
<h1>Parcours urgence et refus</h1>
<p>Interaction : survol, focus, ou lien d'ancre. Exemple : <a href="#u2">mettre en évidence un cadre</a>.</p>
<figure class="schema"><svg viewBox="0 0 680 410" role="img" aria-label="Parcours urgence et refus">
<g fill="none" stroke="currentColor" stroke-width="1.4">
<path d="M330 68 H164 V110" marker-end="url(#fl2)"/>
<path d="M330 68 H500 V110" marker-end="url(#fl2)"/>
<path d="M164 162 V220" marker-end="url(#fl2)"/>
<path d="M500 162 V220" marker-end="url(#fl2)"/>
<path d="M164 272 H330 V330" marker-end="url(#fl2)"/>
<path d="M500 272 H330 V330" marker-end="url(#fl2)"/>
</g>
<defs><marker id="fl2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<g class="etape" id="u1" tabindex="0"><rect x="180" y="16" width="300" height="52" rx="8"/><text x="330" y="34" text-anchor="middle" font-size="13">Patient qui ne décide pas</text><text x="330" y="50" text-anchor="middle" font-size="13">ou qui refuse</text></g><g class="etape" id="u2" tabindex="0"><rect x="24" y="110" width="280" height="52" rx="8"/><text x="164" y="128" text-anchor="middle" font-size="13">Capable et refus stable</text><text x="164" y="144" text-anchor="middle" font-size="13">respecter, tracer</text></g><g class="etape" id="u3" tabindex="0"><rect x="360" y="110" width="280" height="52" rx="8"/><text x="500" y="128" text-anchor="middle" font-size="13">Incapable, danger immédiat</text><text x="500" y="144" text-anchor="middle" font-size="13">soins indispensables</text></g><g class="etape" id="u4" tabindex="0"><rect x="24" y="220" width="280" height="52" rx="8"/><text x="164" y="238" text-anchor="middle" font-size="13">Proposer l'alternative</text><text x="164" y="254" text-anchor="middle" font-size="13">ne pas passer outre</text></g><g class="etape" id="u5" tabindex="0"><rect x="360" y="220" width="280" height="52" rx="8"/><text x="500" y="238" text-anchor="middle" font-size="13">Chercher un refus écrit</text><text x="500" y="254" text-anchor="middle" font-size="13">s'il ne retarde rien</text></g><g class="etape" id="u6" tabindex="0"><rect x="180" y="330" width="300" height="52" rx="8"/><text x="330" y="348" text-anchor="middle" font-size="13">Dès que c'est possible</text><text x="330" y="364" text-anchor="middle" font-size="13">reprendre avec lui</text></g>
</svg>
<figcaption>À gauche, le refus d'une personne capable. À droite, l'urgence chez une personne incapable. Les deux se rejoignent : on rediscute dès que la personne peut décider.</figcaption>
</figure>
</body></html>
