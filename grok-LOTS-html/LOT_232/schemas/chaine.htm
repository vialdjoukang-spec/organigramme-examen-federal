<h1>Chaîne de l'information</h1>
<p>Interaction : survol, focus, ou lien d'ancre. Exemple : <a href="#c5">mettre en évidence un cadre</a>.</p>
<figure class="schema"><svg viewBox="0 0 680 420" role="img" aria-label="Chaîne de l'information avant une intervention">
<g class="etape" id="c1" tabindex="0"><rect x="24" y="16" width="300" height="52" rx="8"/><text x="174" y="44" text-anchor="middle" font-size="13">1. Diagnostic</text></g><g class="etape" id="c2" tabindex="0"><rect x="354" y="16" width="300" height="52" rx="8"/><text x="504" y="44" text-anchor="middle" font-size="13">2. Nature et but</text></g><g class="etape" id="c3" tabindex="0"><rect x="24" y="94" width="300" height="52" rx="8"/><text x="174" y="122" text-anchor="middle" font-size="13">3. Bénéfices</text></g><g class="etape" id="c4" tabindex="0"><rect x="354" y="94" width="300" height="52" rx="8"/><text x="504" y="122" text-anchor="middle" font-size="13">4. Risques fréquents</text></g><g class="etape" id="c5" tabindex="0"><rect x="24" y="172" width="300" height="52" rx="8"/><text x="174" y="200" text-anchor="middle" font-size="13">5. Risques graves</text></g><g class="etape" id="c6" tabindex="0"><rect x="354" y="172" width="300" height="52" rx="8"/><text x="504" y="200" text-anchor="middle" font-size="13">6. Alternatives</text></g><g class="etape" id="c7" tabindex="0"><rect x="24" y="250" width="300" height="52" rx="8"/><text x="174" y="278" text-anchor="middle" font-size="13">7. Abstention</text></g><g class="etape" id="c8" tabindex="0"><rect x="354" y="250" width="300" height="52" rx="8"/><text x="504" y="278" text-anchor="middle" font-size="13">8. Coût et suites</text></g><g class="etape" id="c9" tabindex="0"><rect x="24" y="328" width="300" height="52" rx="8"/><text x="174" y="356" text-anchor="middle" font-size="13">9. Reformulation</text></g><g class="etape" id="c10" tabindex="0"><rect x="354" y="328" width="300" height="52" rx="8"/><text x="504" y="356" text-anchor="middle" font-size="13">10. Délai, puis trace</text></g>
</svg>
<figcaption>Dix maillons. Un maillon manquant, surtout un risque grave ou une alternative, empêche de parler d'information adéquate. Le survol épaissit le cadre.</figcaption>
</figure>
