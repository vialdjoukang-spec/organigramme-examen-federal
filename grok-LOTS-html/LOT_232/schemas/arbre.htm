<h1>Arbre capacité et représentation</h1>
<p>Interaction : survol, focus, ou lien d'ancre. Exemple : <a href="#capa">mettre en évidence un cadre</a>.</p>
<figure class="schema"><svg viewBox="0 0 700 540" role="img" aria-label="Arbre capacité et représentation">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.4"><path d="M370 58 V88" marker-end="url(#fl)"/><path d="M280 134 H145 V170" marker-end="url(#fl)"/><path d="M460 134 H530 V170" marker-end="url(#fl)"/><path d="M145 222 V250" marker-end="url(#fl)"/><path d="M530 222 V250" marker-end="url(#fl)"/><path d="M530 296 V322" marker-end="url(#fl)"/><path d="M530 368 V394" marker-end="url(#fl)"/><path d="M530 446 V472" marker-end="url(#fl)"/></g>
<g class="etape" id="acte" tabindex="0"><rect x="250" y="12" width="240" height="46" rx="8"/><text x="370" y="30" text-anchor="middle" font-size="13">Acte proposé</text><text x="370" y="46" text-anchor="middle" font-size="13">hors recherche</text></g><g class="etape" id="urgence" tabindex="0"><rect x="230" y="88" width="280" height="46" rx="8"/><text x="370" y="106" text-anchor="middle" font-size="13">Danger immédiat ?</text><text x="370" y="122" text-anchor="middle" font-size="13">Patient incapable</text></g><g class="etape" id="oui379" tabindex="0"><rect x="20" y="170" width="250" height="52" rx="8"/><text x="145" y="188" text-anchor="middle" font-size="13">Oui : soins indispensables</text><text x="145" y="204" text-anchor="middle" font-size="13">volonté présumée</text></g><g class="etape" id="refusant" tabindex="0"><rect x="20" y="250" width="250" height="52" rx="8"/><text x="145" y="268" text-anchor="middle" font-size="13">Refus anticipé connu</text><text x="145" y="284" text-anchor="middle" font-size="13">ne pas passer outre</text></g><g class="etape" id="capa" tabindex="0"><rect x="390" y="170" width="280" height="52" rx="8"/><text x="530" y="188" text-anchor="middle" font-size="13">Non : capacité pour</text><text x="530" y="204" text-anchor="middle" font-size="13">cette décision, ce moment</text></g><g class="etape" id="capable" tabindex="0"><rect x="390" y="250" width="280" height="46" rx="8"/><text x="530" y="268" text-anchor="middle" font-size="13">Capable : il décide</text><text x="530" y="284" text-anchor="middle" font-size="13">accord ou refus</text></g><g class="etape" id="doute" tabindex="0"><rect x="390" y="322" width="280" height="46" rx="8"/><text x="530" y="340" text-anchor="middle" font-size="13">Doute : quatre aptitudes</text><text x="530" y="356" text-anchor="middle" font-size="13">puis réévaluer</text></g><g class="etape" id="incap" tabindex="0"><rect x="390" y="394" width="280" height="52" rx="8"/><text x="530" y="412" text-anchor="middle" font-size="13">Incapable : directives</text><text x="530" y="428" text-anchor="middle" font-size="13">puis représentant</text></g><g class="etape" id="plan" tabindex="0"><rect x="390" y="472" width="280" height="46" rx="8"/><text x="530" y="490" text-anchor="middle" font-size="13">Plan de traitement</text><text x="530" y="506" text-anchor="middle" font-size="13">associer la personne</text></g>
</svg>
<figcaption>Chaque cadre réagit au survol, au focus et à l'ancre. La branche de gauche est l'urgence. La branche de droite part de la capacité.</figcaption>
