<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img">
<title>Cinétique schématique de la troponine cardiaque haute sensibilité</title>
<style>text{font-family:"Atkinson Hyperlegible",Verdana,sans-serif;fill:#1d2a30}</style>
<rect width="960" height="520" fill="#ffffff"/>
<text x="90" y="36" font-size="20" font-weight="700" fill="#14303b">Cinétique schématique de la troponine cardiaque haute sensibilité</text>
<polyline points="90,56 90,420 900,420" fill="none" stroke="#1d2a30" stroke-width="2"/>
<line x1="90.0" y1="420" x2="90.0" y2="426" stroke="#1d2a30" stroke-width="2"/>
<text x="82.0" y="446" font-size="15">0</text>
<line x1="359.7" y1="420" x2="359.7" y2="426" stroke="#1d2a30" stroke-width="2"/>
<text x="351.7" y="446" font-size="15">1</text>
<line x1="629.5" y1="420" x2="629.5" y2="426" stroke="#1d2a30" stroke-width="2"/>
<text x="621.5" y="446" font-size="15">2</text>
<line x1="900.0" y1="420" x2="900.0" y2="426" stroke="#1d2a30" stroke-width="2"/>
<text x="892.0" y="446" font-size="15">3</text>
<text x="90" y="468" font-size="15" fill="#4f5f66">Heures depuis le début des symptômes (schéma). Repères 0, 1, 2 et 3 h : algorithmes 0/1 h ou 0/2 h, contrôle à 3 h.</text>
<polyline points="90.0,274.4 900.0,274.4" fill="none" stroke="#141416" stroke-width="4" stroke-dasharray="14 8" stroke-linecap="round"/>
<circle cx="900.0" cy="252.4" r="14" fill="#141416"/>
<text x="895.0" y="257.4" font-size="16" fill="#ffffff">1</text>
<polyline points="106.2,361.8 235.8,318.1 414.0,238.0 657.0,157.9 900.0,107.0" fill="none" stroke="#a1262f" stroke-width="4" stroke-dasharray="14 8" stroke-linecap="round"/>
<circle cx="414.0" cy="216.0" r="14" fill="#a1262f"/>
<text x="409.0" y="221.0" font-size="16" fill="#ffffff">2</text>
<polyline points="106.2,208.9 900.0,201.6" fill="none" stroke="#0b5d86" stroke-width="4" stroke-dasharray="14 8" stroke-linecap="round"/>
<circle cx="900.0" cy="179.6" r="14" fill="#0b5d86"/>
<text x="895.0" y="184.6" font-size="16" fill="#ffffff">3</text>
</svg>