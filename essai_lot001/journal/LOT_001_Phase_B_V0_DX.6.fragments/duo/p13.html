
<div class="ok">
<ul>
<li>La <a class="tm med" data-auto="1" href="#med-03f17a65">thiamine</a> précède tout glucose chez le buveur confus.</li>
<li>Le sevrage débute dès 8 heures, convulse avant 48 heures, culmine à 72 heures.</li>
<li>Une benzodiazépine (<a class="tm med" data-auto="1" href="#med-a641ca0d">oxazépam</a>, <a class="tm med" data-auto="1" href="#med-a641ca0d">Seresta®</a> 30 mg) traite le sevrage.</li>
<li>Le suivi dure au moins 2 ans.</li>
</ul>
</div>
