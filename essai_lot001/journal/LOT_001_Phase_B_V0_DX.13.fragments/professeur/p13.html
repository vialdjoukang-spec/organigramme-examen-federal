
<ul>
<li>Les métanéphrines plasmatiques se dosent couché.</li>
<li>Le blocage α précède le β, 7 à 14 jours avant l'opération.</li>
<li>Une crise peut être déclenchée par le <a class="tm med" data-auto="1" href="#med-018b00e6">glucagon</a>, le <a class="tm med" data-auto="1" href="#med-645eaafc">métoclopramide</a> et la <a class="tm med" data-auto="1" href="#med-3e6a53eb">morphine</a>.</li>
<li>Le <abbr class="ab" data-k="PPGL" tabindex="0">PPGL</abbr> impose un suivi de 10 ans au moins.</li>
