
<p>La prévention primaire réduit le tabac, l'alcool et le <abbr class="ab" data-k="VIH" tabindex="0">VIH</abbr>.</p>
<p>La prévention secondaire biopsie tout ganglion persistant plus de 4 semaines<sup class="r"><a href="#sb-1">1</a></sup>.</p>
<p>La prévention tertiaire surveille la cardiotoxicité, les seconds cancers et la fertilité<sup class="r"><a href="#sb-8">8</a></sup>.</p>
