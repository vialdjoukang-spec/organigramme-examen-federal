
<ul><li><b>Primaire.</b> Plaies, caries et vaccinations (plan <abbr class="ab" data-k="OFSP" tabindex="0">OFSP</abbr>/<abbr class="ab" data-k="CFV" tabindex="0">CFV</abbr>) sont pris en charge.</li><li><b>Secondaire.</b> Une angine ou plaie infectée est traitée vite ; un ganglion persistant après 4 semaines est réévalué.</li><li><b>Tertiaire.</b> Le foyer chronique (dent, sinus, mycose) est traité.</li></ul>
