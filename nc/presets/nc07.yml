# Préréglages d'affichage du nerf facial (VII) · Dédale, 17.10.2026.
# Une image = une idée, 8 étiquettes au plus, posées à côté de la structure avec un trait de rappel court.
# Chaque étiquette renvoie (« ref ») à une entrée sourcée de nc/annot/nc07.yml (Ariane) : sa position vient de
# l'ancre de cette entrée ; « accroche: nerf » la déplace sur le point du nerf le plus proche (rameaux terminaux).
# Les textes sont des résumés courts des libellés d'Ariane ; le texte complet reste dans les données.
# Un préréglage = un jeu de couches visibles (data-couches) ; Hermès bascule les couches par [data-couche].
nerf: nc07
presets:
  trajet:
    titre: "VII · Trajet : segments et foramens"
    vue: "34"
    cadre: {ancres: ["VII·émergence", "VII·foramen stylo-mastoïdien", "VII·premier genou", "VII·pore acoustique interne", "VII·origine de la corde du tympan"], marge: 0.3}
    encart: {position: bd, taille: 230}
    couches: [trait, nerf, foramens, legendes]
    etiquettes:
      - {ref: S1, texte: "Segment cisternal", entre: ["VII·émergence", "VII·pore acoustique interne"]}
      - {ref: F1, texte: "Pore acoustique interne", couche: foramens}
      - {ref: L2, texte: "Ganglion géniculé | (fin du labyrinthique)", couche: legendes}
      - {ref: S4, texte: "Segment tympanique", entre: ["VII·premier genou", "VII·second genou"]}
      - {ref: S5, texte: "Segment mastoïdien"}
      - {ref: F3, texte: "Foramen stylo-mastoïdien", couche: foramens}
      - {ref: B2, texte: "Corde du tympan", ancre: "Tympanic membrane.r", accroche: nerf}
    legende:
      - "Rocher agrandi ; encart : tête entière."
  branches:
    titre: "VII · Les 5 branches de la face"
    vue: profil
    cadre: {ancres: ["Frontalis muscle.r", "Platysma.r", "Parotid gland.r", "Orbicularis oris muscle.r", "VII·foramen stylo-mastoïdien"], marge: 0.18}
    couches: [trait, nerf, legendes]
    etiquettes:
      - {ref: R1, texte: "Parotide (plexus)"}
      - {ref: B3, texte: "Temporal", accroche: nerf}
      - {ref: B4, texte: "Zygomatique", accroche: nerf}
      - {ref: B5, texte: "Buccal", accroche: nerf}
      - {ref: B6, texte: "Marginal mandibulaire", accroche: nerf}
      - {ref: B7, texte: "Cervical", accroche: nerf}
    legende:
      - "De haut en bas : T-Z-B-M-C."
  fonctions:
    titre: "VII · Fonctions et territoires"
    vue: "34"
    cadre: {ancres: ["Frontalis muscle.r", "Platysma.r", "Cavity of concha.r", "Lacrimal gland.r", "Tongue"], marge: 0.12}
    couches: [trait, territoires, nerf, noyaux, legendes]
    remplissages: {moteur: "#e3efe6", gout: "#f6d7b0", parasympathique: "#cfe3f5", sensitif: "#e3d6f2"}
    etiquettes:
      - {ref: T1, ancre: "Zygomaticus major muscle.r", texte: "Motricité : mimique", couche: territoires}
      - {ref: G4, texte: "Goût : 2/3 ant. de la langue"}
      - {ref: G1, texte: "Larmes"}
      - {ref: G2, texte: "Salive"}
      - {ref: G5, ancre: "Cavity of concha.r", texte: "Sensibilité : conque"}
      - {ref: N1, texte: "Noyaux du VII (pont)", couche: noyaux}
    legende:
      - "Aplats : vert moteur, orange goût,"
      - "bleu sécrétion, violet sensibilité."
  lesions:
    titre: "VII · Sites lésionnels et déficit"
    vue: "34"
    cadre: {ancres: ["VII·émergence", "VII·foramen stylo-mastoïdien", "VII·premier genou", "VII·pore acoustique interne", "VII·origine de la corde du tympan"], marge: 0.3}
    encart: {position: bd, taille: 230}
    couches: [trait, nerf, lesions, legendes]
    etiquettes:
      - {ref: L1, texte: "1 · Central | front épargné", espace: encart}
      - {ref: L2, texte: "2 · Géniculé | œil sec"}
      - {ref: L3, texte: "3 · Tympanique | hyperacousie"}
      - {ref: L4, texte: "4 · Mastoïdien | goût perdu"}
      - {ref: L5, texte: "5 · Stylo-mastoïdien | motricité seule"}
    legende:
      - "1 en rouge : urgence (AVC à exclure)."
      - "2 à 5 : périphérique, front compris."
  plan:
    titre: "VII · Plan du nerf (Gray 1918)"
    vue: plan
    couches: [trait, legendes]
    etiquettes: []
    legende:
      - "Plan du VII et de l'intermédiaire (Gray)."
