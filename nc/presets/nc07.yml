# États d'affichage du nerf facial (VII) · Dédale, 17.10.2026.
# Trois images publiées seulement : vues face, profil et trois quarts (assets/nc/nc07-<vue>.svg), crâne au crayon
# et nerf en jaune. Chaque SVG contient TOUS les états ci-dessous : un état = un jeu de couches visibles et
# 8 étiquettes au plus ; Hermès passe d'un état à l'autre (data-etats, data-etat) sans changer d'image.
# Chaque étiquette renvoie (« ref ») à une entrée sourcée de nc/annot/nc07.yml (Ariane) : sa position vient de
# l'ancre de cette entrée ; « accroche: nerf » la ramène sur le point du nerf le plus proche ; « entre » prend le
# milieu de deux repères, ramené sur le nerf. Les textes résument les libellés d'Ariane (texte complet : données).
nerf: nc07
titre: "Nerf facial (VII)"
vues: [face, profil, "34"]
etat_defaut: trajet
etats:
  trajet:
    nom: "Trajet"
    couches: [trait, nerf, noyaux, foramens, legendes]
    etiquettes:
      - {ref: N1, texte: "Noyau moteur (pont)", couche: noyaux}
      - {ref: S1, texte: "Segment cisternal", entre: ["VII·émergence", "VII·pore acoustique interne"]}
      - {ref: F1, texte: "Pore acoustique interne", couche: foramens}
      - {ref: L2, texte: "Ganglion géniculé", couche: legendes}
      - {ref: S4, texte: "Segment tympanique", entre: ["VII·premier genou", "VII·second genou"]}
      - {ref: S5, texte: "Segment mastoïdien"}
      - {ref: F3, texte: "Foramen stylo-mastoïdien", couche: foramens}
      - {ref: B2, texte: "Corde du tympan", ancre: "Tympanic membrane.r", accroche: nerf}
    legende:
      - "Trajet : du noyau aux foramens."
  branches:
    nom: "Branches"
    couches: [trait, nerf, noyaux, legendes]
    etiquettes:
      - {ref: R1, texte: "Parotide (plexus)"}
      - {ref: B3, texte: "Temporal", accroche: nerf}
      - {ref: B4, texte: "Zygomatique", accroche: nerf}
      - {ref: B5, texte: "Buccal", accroche: nerf}
      - {ref: B6, texte: "Marginal mandibulaire", accroche: nerf}
      - {ref: B7, texte: "Cervical", accroche: nerf}
    legende:
      - "Branches, de haut en bas : T-Z-B-M-C."
  fonctions:
    nom: "Fonctions"
    couches: [trait, territoires, nerf, noyaux, legendes]
    remplissages: {gout: "#f6d7b0", parasympathique: "#cfe3f5", sensitif: "#e3d6f2"}   # moteur : le nerf lui-même (aplat retiré, il couvrait la voûte)
    etiquettes:
      - {ref: T1, ancre: "Zygomaticus major muscle.r", texte: "Motricité : mimique", couche: territoires}
      - {ref: G4, texte: "Goût : 2/3 ant. langue"}
      - {ref: G1, texte: "Larmes"}
      - {ref: G2, texte: "Salive"}
      - {ref: G5, ancre: "Cavity of concha.r", texte: "Sensibilité : conque"}
    legende:
      - "Aplats : orange goût, bleu sécrétion,"
      - "violet sensibilité ; jaune : le nerf."
  lesions:
    nom: "Sites lésionnels"
    couches: [trait, nerf, noyaux, lesions, legendes]
    etiquettes:
      - {ref: L1, texte: "1 · Central | front épargné"}
      - {ref: L2, texte: "2 · Géniculé | œil sec"}
      - {ref: L3, texte: "3 · Tympanique | hyperacousie"}
      - {ref: L4, texte: "4 · Mastoïdien | goût perdu"}
      - {ref: L5, texte: "5 · Stylo-mastoïdien | motricité seule"}
    legende:
      - "1 en rouge : urgence (AVC à exclure)."
      - "2 à 5 : périphérique, front compris."
# Retraits par vue (étiquettes dont la structure est cachée ou confondue dans cette vue) : complétés après essai.
par_vue:
  face: {retirer: {trajet: [S1]}}     # de face et de trois quarts, le segment cisternal se confond avec le pore
  "34": {retirer: {trajet: [S1]}}
