<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANIMATION_HARNAIS</title>
<style>
:root{--bg1:#0b1020;--bg2:#1a1740;--card:#141b34cc;--ln:#2b3566;--fg:#e8ecff;--mut:#8b96c9;--g:#22d38a;--r:#ff5d73;--b:#5aa9ff;--v:#b388ff;--y:#ffd43b;--o:#ffa94d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--fg);font:14px/1.45 system-ui,sans-serif;background:radial-gradient(900px 500px at 15% -10%,#2a2570,transparent),radial-gradient(800px 500px at 100% 110%,#0f4a5a66,transparent),var(--bg1);padding:22px clamp(12px,3vw,40px)}
h1{margin:0;font-size:1.15rem;letter-spacing:.14em}.sub{color:var(--mut);font-size:12px;margin:2px 0 14px}
.wrap{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:10px;backdrop-filter:blur(6px)}
svg{width:100%;height:auto;display:block}.node rect{fill:#10163a;stroke:var(--ln);stroke-width:1.5;rx:12;transition:.35s}.node text{fill:var(--fg);font:600 12px system-ui}.node .t2{fill:var(--mut);font:400 10px system-ui}
.node.on rect{stroke:var(--c);stroke-width:2.6;filter:drop-shadow(0 0 10px var(--c));fill:#16204f}.node.done rect{stroke:var(--c);opacity:.9}
.edge{fill:none;stroke:#3a4590;stroke-width:1.6;stroke-dasharray:3 5}.edge.fb{stroke:var(--r);stroke-dasharray:6 6;opacity:.7}.edge.hot{stroke:var(--g);stroke-dasharray:none;stroke-width:2.4}
.p{fill:var(--y);filter:drop-shadow(0 0 7px var(--y))}.halo{fill:none;stroke:var(--g);stroke-width:2;opacity:.5;animation:h 1s infinite}@keyframes h{0%{r:6;opacity:.7}100%{r:20;opacity:0}}
.cap{display:flex;gap:14px;align-items:center;margin:12px 4px 4px;flex-wrap:wrap}.cap b{color:var(--y)}#cap{flex:1;min-width:260px;font-size:14px;min-height:2.6em}
button,input{accent-color:var(--v)}button{border:1px solid var(--ln);background:#1c2455;color:var(--fg);border-radius:10px;padding:6px 14px;font:600 13px system-ui;cursor:pointer}button:hover{border-color:var(--v)}
.ring{position:relative;width:74px;height:74px}.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 14px system-ui}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin:8px 4px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style></head><body>
<h1>HARNAIS · FONCTIONNEMENT</h1><div class="sub">Un seul circuit de vérité · aucun audit externe · scripts, automates, MCP et skills gratuits · un LOT à la fois (file G : 16 LOTS)</div>
<div class="wrap"><svg id="s" viewBox="0 0 1000 440"><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5a67b8"/></marker></defs>
<g id="eg"></g><g id="ng"></g><circle id="pt" class="p" r="6" cx="-20" cy="-20"/></svg>
<div class="cap"><div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="#26305a" stroke-width="7"/><circle id="rg" cx="40" cy="40" r="32" fill="none" stroke="#22d38a" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" transform="rotate(-90 40 40)"/></svg><span id="lt">LOT 1/16</span></div>
<div id="cap">…</div><button id="pl">⏸ Pause</button><label style="color:var(--mut);font-size:12px">vitesse <input id="sp" type="range" min="0.4" max="3" step="0.1" value="1"></label></div>
<div class="leg"><span><i style="background:var(--b)"></i>entrée</span><span><i style="background:var(--v)"></i>rédaction</span><span><i style="background:var(--o)"></i>contrôle par scripts</span><span><i style="background:var(--g)"></i>sortie</span><span><i style="background:var(--r)"></i>boucle de correction (2 cycles au plus)</span></div></div>
<script>
const N={prompt:["Prompt projet","444 · SHA-256 · veille 1 s",30,30,"--b"],expert:["prompt_expert","exigences du Prompt ULTIME",270,30,"--b"],taches:["Tableau de tâches","blocs de 5 chapitres",510,30,"--b"],red:["4 rédacteurs","Phase A + 3 × 5 DD",750,30,"--v"],
verrou:["Verrou","un agent = un fichier",750,140,"--v"],src:["Sources gratuites","AIPS · PubMed · SOURCES",510,140,"--b"],fich:["Fichiers HTML","100–200 Ko · 14 points",270,140,"--v"],
med:["Contrôle médical","doses/AIPS · PMID · chiffres/sources",30,250,"--o"],lang:["Contrôle de langue","LanguageTool · spaCy · abréviations",270,250,"--o"],porte:["Porte ≥ 90 % · 0 critique","audit avant sortie + hook git",510,250,"--o"],
pr:["PR · CI verte","fusion par commit de fusion",750,250,"--g"],lec:["5 leçons au plus","par rôle · Harnais",750,360,"--g"],snap:["Instantané + captures","jalon de LOT · Rappel mémoire",510,360,"--g"],next:["LOT suivant","un seul actif",270,360,"--g"]};
const E=[["prompt","expert"],["expert","taches"],["taches","red"],["red","verrou"],["src","red"],["verrou","fich"],["fich","med"],["med","lang"],["lang","porte"],["porte","pr"],["pr","lec"],["lec","snap"],["snap","next"],["next","prompt"],["porte","red","fb"]];
const S=[["prompt",0,"Le prompt du projet est en lecture seule ; la veille vérifie son empreinte chaque seconde."],["expert",0,"Chaque agent lit d'abord les exigences du Prompt ULTIME, extraites par script."],["taches",0,"Le tableau de tâches distribue les fichiers : 1 Phase A + 3 blocs de 5 chapitres."],["red",0,"4 rédacteurs travaillent en parallèle, sources AIPS et PubMed gratuites à l'appui."],["verrou",0,"Un verrou par fichier : zéro collision, indépendance totale."],["fich",0,"Les fichiers HTML sont écrits : 100–200 Ko, densité maximale, 14 points."],["med",0,"Script médical : chaque dose retrouvée dans le texte AIPS, chaque PMID existant, chaque chiffre dans sa source."],["lang",0,"Script de langue : grammaire, accords, abréviations définies, phrases verbales."],["porte",0,"Porte de sortie : ≥ 90 %, zéro critique. Sinon, retour aux rédacteurs (boucle rouge)."],["porte","fb","Écart détecté → le rapport devient la liste de corrections ; 2 cycles au plus."],["pr",0,"Conforme : commit (hook pre-commit), PR, CI verte, fusion par commit de fusion."],["lec",0,"Cinq leçons au plus par rôle sont inscrites dans le Harnais."],["snap",0,"Jalon : instantané du tableau de bord, captures, onglet Rappel mémoire."],["next",0,"Le LOT suivant démarre seulement quand celui-ci est fusionné."]];
const ns="http://www.w3.org/2000/svg",$=i=>document.getElementById(i);const el=(t,a,p)=>{const x=document.createElementNS(ns,t);for(const k in a)x.setAttribute(k,a[k]);p&&p.appendChild(x);return x};
const W=170,H=62,P={};for(const k in N)P[k]=[N[k][2]+W/2,N[k][3]+H/2];
const path=(a,b,fb)=>{const [x1,y1]=P[a],[x2,y2]=P[b];const dx=x2-x1,dy=y2-y1;if(Math.abs(dy)<5)return`M${x1+(dx>0?W/2:-W/2)} ${y1}L${x2+(dx>0?-W/2:W/2)} ${y2}`;if(a=="next"&&b=="prompt")return`M${x1-W/2} ${y1}C${-10} ${y1} ${-10} ${y2} ${x2-W/2} ${y2}`;const sy=dy>0?H/2:-H/2;return fb?`M${x1} ${y1-H/2}C${x1} ${y1-80} ${x2+60} ${y2+90} ${x2} ${y2+H/2}`:`M${x1} ${y1+sy}L${x2} ${y2-sy}`};
const ed={};E.forEach(([a,b,f])=>{const p=el("path",{d:path(a,b,f),class:"edge"+(f?" fb":""),"marker-end":"url(#a)"},$("eg"));ed[a+b]=p});
const nd={};for(const k in N){const g=el("g",{class:"node",style:`--c:var(${N[k][4]})`},$("ng"));el("rect",{x:N[k][2],y:N[k][3],width:W,height:H},g);el("text",{x:N[k][2]+12,y:N[k][3]+27},g).textContent=N[k][0];const t=el("text",{x:N[k][2]+12,y:N[k][3]+46,class:"t2"},g);t.textContent=N[k][1];nd[k]=g}
// veille : halo permanent sur le prompt
el("circle",{cx:N.prompt[2]+W-14,cy:N.prompt[3]+14,r:6,class:"halo"},$("ng"));
let i=0,lot=1,play=true,t=0,seg=null;const pt=$("pt");
function go(n){const s=S[n],k=s[0];Object.values(nd).forEach(x=>x.classList.remove("on"));nd[k].classList.add("on");nd[k].classList.add("done");$("cap").innerHTML="<b>"+(n+1)+"/"+S.length+"</b> · "+s[2];
 const prev=n>0?S[n-1][0]:"next";let key=s[1]=="fb"?"porte"+"red":(prev+k);seg=ed[key]||ed[prev+k]||null;if(seg){seg.classList.add("hot");seg.dataset.len=seg.getTotalLength()}t=0}
function tick(){requestAnimationFrame(tick);if(!play)return;const sp=+$("sp").value;t+=0.012*sp;if(seg){const L=+seg.dataset.len,p=seg.getPointAtLength(Math.min(1,t)*L);pt.setAttribute("cx",p.x);pt.setAttribute("cy",p.y)}
 if(t>=1.35){if(seg)seg.classList.remove("hot");i++;if(i>=S.length){i=0;lot=lot%16+1;Object.values(nd).forEach(x=>x.classList.remove("done"));$("lt").textContent="LOT "+lot+"/16";$("rg").setAttribute("stroke-dashoffset",201*(1-lot/16))}go(i)}}
$("pl").onclick=()=>{play=!play;$("pl").textContent=play?"⏸ Pause":"▶ Lecture"};$("rg").setAttribute("stroke-dashoffset",201*(1-1/16));go(0);tick();
</script></body></html>
