
<p>La prévention primaire repose sur l'hygiène et les vaccinations recommandées par l'<abbr class="ab" data-k="OFSP" tabindex="0">OFSP</abbr>.</p>
<p>La prévention secondaire dépiste tôt le malaise post-effort, adapte le repos et réévalue le patient à 6 semaines.</p>
<p>La prévention tertiaire gère l'énergie, adapte le poste et soutient le patient fatigué<sup class="r"><a href="#sb-7">7</a></sup>.</p>
